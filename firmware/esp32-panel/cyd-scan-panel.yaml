# ---------------------------------------------------------------------
# scan-bridge HTTP calls. Kept as scripts so both on_boot and the
# interval triggers below share one code path.
# ---------------------------------------------------------------------

script:
  - id: refresh_profiles
    mode: restart
    then:
      # Nothing to fetch without both a bridge URL and a bearer token —
      # skip the request rather than firing it at an empty/default
      # target. Slots simply stay hidden (total_profile_count stays at
      # its initial 0) until both are set from the web_server dashboard.
      - if:
          condition:
            lambda: "return !id(bridge_url).state.empty() && !id(bridge_token).state.empty();"
          else:
            # This branch used to be absent, and that is why "the grid
            # was empty for five minutes" could not be diagnosed from a
            # log: the script skipped in total silence and the only
            # evidence was the ABSENCE of a request. Naming which of
            # the two values is missing turns the next occurrence into
            # a one-line answer.
            - lambda: |-
                ESP_LOGW("panel",
                         "profile refresh skipped: bridge_url is %s, bridge_token is %s "
                         "-- set both on this dashboard; the grid stays empty until then",
                         id(bridge_url).state.empty() ? "EMPTY" : "set",
                         id(bridge_token).state.empty() ? "EMPTY" : "set");
          then:
            - lambda: |-
                id(profiles_url) = id(bridge_url).state + "/profiles";
                // Never logged. The Authorization header is the bridge
                // bearer token; the log is readable by anyone who can
                // reach the panel's dashboard.
                id(profiles_auth) = std::string("Bearer ") + id(bridge_token).state;
                id(request_started_ms) = millis();
                ESP_LOGI("panel", "-> GET %s", id(profiles_url).c_str());
            - http_request.get:
                url: !lambda 'return id(profiles_url).c_str();'
                request_headers:
                  Authorization: !lambda 'return id(profiles_auth).c_str();'
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        uint32_t took = millis() - id(request_started_ms);
                        if (response->status_code != 200) {
                          ESP_LOGE("panel",
                                   "<- GET /profiles status=%d duration_ms=%u -- profile grid keeps its previous contents",
                                   response->status_code, took);
                          ESP_LOGE("panel", "   body: %s", body.substr(0, 200).c_str());
                          return;
                        }
                        ESP_LOGI("panel", "<- GET /profiles status=200 bytes=%u duration_ms=%u",
                                 (unsigned) body.length(), took);
                        ESP_LOGD("panel", "   body: %s", body.substr(0, 200).c_str());
                        json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["profiles"].is<JsonArray>()) {
                            ESP_LOGW("panel", "GET /profiles: unexpected body shape");
                            return false;
                          }
                          JsonArray arr = root["profiles"];
                          if (arr.size() == 0) {
                            ESP_LOGW("panel",
                                     "GET /profiles returned an empty list -- the grid will be blank, "
                                     "and a tap cannot start anything");
                          }
                          // Cap defensively — the 9 static button slots
                          // can only ever show one page's worth at a
                          // time (up to 3x3), but `render_page` walks
                          // this whole vector's `.size()` to compute
                          // page count, so an unbounded bridge response
                          // must not be able to grow it unbounded too.
                          const size_t cap = 100;
                          size_t count = arr.size() < cap ? arr.size() : cap;
                          id(total_profile_count) = static_cast<int>(count);
                          id(all_profile_names).clear();
                          id(all_profile_descs).clear();
                          id(all_profile_names).reserve(count);
                          id(all_profile_descs).reserve(count);
                          for (size_t i = 0; i < count; i++) {
                            JsonObject p = arr[i];
                            id(all_profile_names).push_back(p["name"] | std::string(""));
                            id(all_profile_descs).push_back(p["description"] | std::string(""));
                            ESP_LOGD("panel", "   profile[%u] name='%s' description='%s'",
                                     (unsigned) i,
                                     id(all_profile_names)[i].c_str(),
                                     id(all_profile_descs)[i].c_str());
                          }
                          ESP_LOGI("panel", "profiles loaded: %u (of %u sent)",
                                   (unsigned) count, (unsigned) arr.size());
                          return true;
                        });
                    # Apply the just-parsed profile list to the grid.
                    # Split out of the parsing lambda above on purpose —
                    # see the PR description for why (LVGL widget
                    # updates go through the documented lvgl.* actions,
                    # not raw pointers from inside a JSON-parsing
                    # callback). `relayout_grid` first (re-applies
                    # geometry in case `grid_rows`/`grid_cols` changed
                    # since the last fetch) then `render_page` (clamps
                    # `page_offset` against the possibly-changed
                    # `total_profile_count` and repaints the current
                    # page) — `relayout_grid` also calls `render_page`
                    # itself at its own end, so this second explicit
                    # call re-runs the same deterministic computation
                    # against unchanged state; harmless, and keeps both
                    # scripts' triggers exactly as documented in the PR
                    # description rather than relying on the chaining
                    # being obvious from reading `relayout_grid` alone.
                    - script.execute: relayout_grid
                    - script.execute: render_page
                on_error:
                  then:
                    - lambda: |-
                        ESP_LOGE("panel",
                                 "<- GET %s FAILED after %u ms: no HTTP response at all. "
                                 "The bridge did not answer -- wrong URL, bridge down, or the panel "
                                 "is not on the same network. Profile grid keeps its previous contents.",
                                 id(profiles_url).c_str(), millis() - id(request_started_ms));

  # Repositions/resizes the 9 static button slots for the current
  # `grid_rows`x`grid_cols` (B1). Triggered from `grid_rows_cfg`'s and
  # `grid_cols_cfg`'s `on_value` and from the end of `refresh_profiles`
  # above. Geometry-only: hiding/showing individual slots and filling
  # their text is `render_page`'s job (called at the end of this
  # script, since a grid-size change also changes how many profiles fit
  # per page and which slice of `all_profile_names`/`all_profile_descs`
  # is "the current page").
  #
  # `col_w` divides `id(screen_width)` (B4: the compile-time
  # `screen_width`/`screen_height` substitution, not a hardcoded 320) by
  # the column count; `row_h` divides `id(screen_height) - 46`, where 46
  # is the fixed chrome this grid does NOT occupy — the 22px header, the
  # 20px footer, and 4px of edge gap between them and the grid — so it
  # stays 46 in both orientations even though `screen_height` itself
  # changes (240 landscape, 320 portrait). The header/footer widgets
  # themselves are NOT parameterized by orientation (out of scope for
  # B4 — see README.md "Display orientation"); only the grid they bound
  # is.
  - id: relayout_grid
    mode: restart
    then:
      # See `ui_ready` in `globals:` — without this guard, a `number`
      # entity restoring a persisted grid size during its own setup()
      # could call this before LVGL has actually created the 9 button
      # widgets below, touching a not-yet-existing widget.
      - if:
          condition:
            lambda: "return id(ui_ready);"
          then:
            - lvgl.widget.update:
                id: slot0_btn
                x: &slot0_x !lambda |-
                    int cols = id(grid_cols);
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int col_w = (id(screen_width) - (cols - 1) * gap) / cols;
                    int col = 0 % cols;
                    return col * (col_w + gap);
                y: &slot0_y !lambda |-
                    int rows = id(grid_rows);
                    int cols = id(grid_cols);
                    if (rows < 1) rows = 1;
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int row_h = (id(screen_height) - 46 - (rows - 1) * gap) / rows;
                    int row = 0 / cols;
                    return 24 + row * (row_h + gap);
                width: &slot_col_width !lambda |-
                    int cols = id(grid_cols);
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    return (id(screen_width) - (cols - 1) * gap) / cols;
                height: &slot_row_height !lambda |-
                    int rows = id(grid_rows);
                    if (rows < 1) rows = 1;
                    int gap = 4;
                    return (id(screen_height) - 46 - (rows - 1) * gap) / rows;
            - lvgl.widget.update:
                id: slot1_btn
                x: &slot1_x !lambda |-
                    int cols = id(grid_cols);
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int col_w = (id(screen_width) - (cols - 1) * gap) / cols;
                    int col = 1 % cols;
                    return col * (col_w + gap);
                y: &slot1_y !lambda |-
                    int rows = id(grid_rows);
                    int cols = id(grid_cols);
                    if (rows < 1) rows = 1;
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int row_h = (id(screen_height) - 46 - (rows - 1) * gap) / rows;
                    int row = 1 / cols;
                    return 24 + row * (row_h + gap);
                width: *slot_col_width
                height: *slot_row_height
            - lvgl.widget.update:
                id: slot2_btn
                x: &slot2_x !lambda |-
                    int cols = id(grid_cols);
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int col_w = (id(screen_width) - (cols - 1) * gap) / cols;
                    int col = 2 % cols;
                    return col * (col_w + gap);
                y: &slot2_y !lambda |-
                    int rows = id(grid_rows);
                    int cols = id(grid_cols);
                    if (rows < 1) rows = 1;
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int row_h = (id(screen_height) - 46 - (rows - 1) * gap) / rows;
                    int row = 2 / cols;
                    return 24 + row * (row_h + gap);
                width: *slot_col_width
                height: *slot_row_height
            - lvgl.widget.update:
                id: slot3_btn
                x: &slot3_x !lambda |-
                    int cols = id(grid_cols);
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int col_w = (id(screen_width) - (cols - 1) * gap) / cols;
                    int col = 3 % cols;
                    return col * (col_w + gap);
                y: &slot3_y !lambda |-
                    int rows = id(grid_rows);
                    int cols = id(grid_cols);
                    if (rows < 1) rows = 1;
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int row_h = (id(screen_height) - 46 - (rows - 1) * gap) / rows;
                    int row = 3 / cols;
                    return 24 + row * (row_h + gap);
                width: *slot_col_width
                height: *slot_row_height
            - lvgl.widget.update:
                id: slot4_btn
                x: &slot4_x !lambda |-
                    int cols = id(grid_cols);
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int col_w = (id(screen_width) - (cols - 1) * gap) / cols;
                    int col = 4 % cols;
                    return col * (col_w + gap);
                y: &slot4_y !lambda |-
                    int rows = id(grid_rows);
                    int cols = id(grid_cols);
                    if (rows < 1) rows = 1;
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int row_h = (id(screen_height) - 46 - (rows - 1) * gap) / rows;
                    int row = 4 / cols;
                    return 24 + row * (row_h + gap);
                width: *slot_col_width
                height: *slot_row_height
            - lvgl.widget.update:
                id: slot5_btn
                x: &slot5_x !lambda |-
                    int cols = id(grid_cols);
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int col_w = (id(screen_width) - (cols - 1) * gap) / cols;
                    int col = 5 % cols;
                    return col * (col_w + gap);
                y: &slot5_y !lambda |-
                    int rows = id(grid_rows);
                    int cols = id(grid_cols);
                    if (rows < 1) rows = 1;
