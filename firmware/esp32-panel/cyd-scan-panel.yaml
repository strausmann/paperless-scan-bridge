        - button:
            id: slot7_btn
            x: *slot7_x
            y: *slot7_y
            width: *slot_col_width
            height: *slot_row_height
            hidden: true
            widgets:
              - label:
                  id: slot7_label
                  align: TOP_MID
                  y: 6
                  text: ""
              - label:
                  id: slot7_sub_label
                  align: BOTTOM_MID
                  y: -6
