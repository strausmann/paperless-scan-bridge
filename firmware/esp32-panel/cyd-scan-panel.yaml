        - button:
            id: slot8_btn
            x: *slot8_x
            y: *slot8_y
            width: *slot_col_width
            height: *slot_row_height
            hidden: true
            widgets:
              - label:
                  id: slot8_label
                  align: TOP_MID
                  y: 6
                  text: ""
              - label:
                  id: slot8_sub_label
                  align: BOTTOM_MID
                  y: -6
                  width: 96
                  long_mode: DOT
                  text: ""
            on_press:
              then:
                - if:
                    condition:
                      lambda: "return !id(scan_in_progress);"
                    then:
                      - lambda: "id(selected_profile) = id(slot_name_8);"
                      - script.execute: do_scan

        # Footer (B2): paging buttons flank the status label, fixed
        # 320-wide row (40 + 236 + 40 + 2x2px gap). Enabled state is
        # data-driven (page boundary) — see render_page in script:, not
        # set here; do_scan disables both during a scan regardless.
        - button:
            id: prev_page_btn
            x: 0
            y: 220
            width: 40
            height: 20
            widgets:
              - label:
                  id: prev_page_label
                  align: CENTER
                  text: "<"
            on_press:
              then:
                - if:
                    condition:
                      lambda: "return !id(scan_in_progress) && id(page_offset) > 0;"
                    then:
                      - lambda: "id(page_offset) -= 1;"
                      - script.execute: render_page

        - label:
            id: status_label
            x: 42
            y: 220
            width: 236
            height: 20
            align: TOP_MID
            text: "idle"

        - button:
            id: next_page_btn
            x: 280
            y: 220
            width: 40
            height: 20
            widgets:
              - label:
                  id: next_page_label
                  align: CENTER
                  text: ">"
            on_press:
              then:
                - if:
                    condition:
                      lambda: |-
                        if (id(scan_in_progress)) return false;
                        int rows = id(grid_rows);
                        int cols = id(grid_cols);
                        if (rows < 1) rows = 1;
                        if (rows > 3) rows = 3;
                        if (cols < 1) cols = 1;
                        if (cols > 3) cols = 3;
                        int page_size = rows * cols;
                        return (id(page_offset) + 1) * page_size < id(total_profile_count);
                    then:
                      - lambda: "id(page_offset) += 1;"
                      - script.execute: render_page

        # Scan-in-progress indicator (Issue #9 item B5). Centered on the
        # page (not pixel-positioned over the button grid specifically) —
        # `align: CENTER` centers on the whole 320x240/240x320 page
        # regardless of orientation (B4), which lands close enough to the
        # visual center of the button-grid area too (the 42px of
        # header+footer chrome is small relative to the full screen) and
        # needs no `screen_width`/`screen_height`-driven geometry lambda
        # like the 9 button slots have. Listed last in `widgets:` on
        # purpose — LVGL draws widgets in list order, so this paints on
        # top of the button grid whenever it is shown. `hidden: true` is
        # the default (idle) state; `do_scan` below unhides it right
        # before firing the blocking `http_request.post`, and every
        # terminal branch — the shared post-if-chain block in
        # `on_response` (success and all four error branches funnel
        # through it) and `on_error` — hides it again, mirroring the
        # existing per-status LED/label reset discipline (Review-Fund
        # PR #31).
        - spinner:
            id: scan_spinner
            align: CENTER
            hidden: true
            width: 60
            height: 60
            spin_time: 1s
            arc_length: 60deg
            indicator:
              arc_color: 0x0080FF
              arc_width: 8
