# ESPHome firmware for the ESP32-2432S028R ("Cheap Yellow Display" / CYD)
# scan-control panel — Issue #9.
#
# v2 scope: secret-free, runtime configuration. This firmware carries no
# Wi-Fi credentials, bridge URL, or bearer token at build time — it ships
# as one public binary via the browser-based ESP Web Tools installer
# (Issue #9, phase E). Wi-Fi is provisioned in-browser via Improv right
# after flashing; the bridge URL and bearer token are `text` entities
# held in flash (NVS) and set from the panel's own `web_server`
# dashboard afterwards. Grid (1x1 up to 3x3, configurable at runtime via
# the "Grid Rows"/"Grid Cols" `number` entities, default 2x3 = today's
# fixed 6-button layout) populated at runtime from GET /profiles,
# tap-to-scan via POST /scan, with a centered spinner shown for the
# duration of the request (Issue #9 item B5). A three-state top-bar
# indicator (green/red/blue) polls GET /ready instead of the old plain
# GET /health, so it reflects the bridge's actual readiness contract —
# green when profiles are loaded and sane-runtime answers, blue when
# only the scanner backend specifically is down, red for every other
# not-ready/unreachable case (Issue #9 item B6). Profiles beyond one
# page are reachable via the footer's prev/next buttons. Display
# orientation (landscape by default, portrait via a `packages:` override
# — Issue #9 item B4) is a build-time choice, not runtime-configurable.
# See README.md for flashing, the mandatory post-flash touch
# calibration, how to build a portrait variant, and known limitations.
#
# Hardware bring-up values below (pins, SPI buses, display/touch options)
# are cross-verified for the ESP32-2432S028R and must not be changed
# without re-verifying against the board's actual wiring — this is the one
# widely-cloned "CYD" board revision this firmware targets.

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "paperless-scan-bridge CYD scan-control panel (v2, Issue #9, secret-free, ${orientation})"
  min_version: "2024.5.0"
  on_boot:
    priority: -100
    then:
      # -100 is very late — guaranteed to run after every component's
      # setup(), including LVGL's (which is what actually constructs
      # the 9 button widgets `relayout_grid` below updates). Setting
      # `ui_ready` here, not at compile-time, is what makes it safe for
      # `grid_rows_cfg`/`grid_cols_cfg` to call `relayout_grid` from
      # their own `on_value` — including the one `on_value` fires
      # during their own setup() while restoring a persisted value,
      # which can run before or after LVGL's setup() depending on
      # component setup-priority ordering. `relayout_grid` checks
      # `ui_ready` first and no-ops otherwise, so that early call can
      # never touch a not-yet-created widget.
      - lambda: "id(ui_ready) = true;"
      - script.execute: relayout_grid
      - script.execute: refresh_profiles
      - script.execute: check_bridge_health

esp32:
  board: esp32dev
  framework:
    type: arduino

substitutions:
  name: cyd-scan-panel
  friendly_name: "Scan Panel"
  # Display orientation (Issue #9 item B4). `orientation` is informational
  # only (surfaced in `esphome.comment` above so the merged config
  # documents which build this is); the eight substitutions below are the
  # ones that actually drive it — `display.dimensions.*`, `lvgl.rotation`
  # and `touchscreen.calibration.*`/`transform.swap_xy` all read from
  # them. Defaults below reproduce today's landscape build byte-for-byte:
  # `display.dimensions`/`lvgl.rotation` in the merged `esphome config`
  # output are unchanged from before these substitutions existed. A
  # portrait build overrides all nine via a `packages:` include wrapper —
  # see README.md "Display orientation" for the exact wrapper and why
  # `display.rotation` (further below) stays hardcoded at 0 either way
  # (ESPHome rejects a non-zero value there once `lvgl:` is in the
  # config — rotation belongs in `lvgl.rotation` instead).
  orientation: landscape
  screen_width: "320"
  screen_height: "240"
  panel_rotation: "0"
  touch_swap_xy: "true"
  touch_x_min: "280"
  touch_x_max: "3860"
  touch_y_min: "340"
  touch_y_max: "3860"

logger:
  baud_rate: 115200

# No `api:` block. This build carries no fixed native-API encryption key
# (a public binary cannot embed a per-device secret), and the panel does
# not need Home Assistant discovery — it is purely an HTTP client of the
# scan-bridge (see README.md "Security model"). `web_server:` below does
# not require `api:` to be present.

# OTA with no fixed password: a public binary cannot ship a shared
# secret either, and per-device OTA passwords are out of scope for v2
# (no on-device way to set one before the first flash). OTA is therefore
# LAN-trust, same posture as the plain-HTTP bridge token below — see
# README.md "Security model". Re-flashing over USB via the same
# installer page is always available regardless.
ota:
  - platform: esphome

wifi:
  # No `ssid:`/`password:` here on purpose — this is the whole point of
  # "secret-free": Wi-Fi station credentials are never build-time values.
  # `esp32_improv`/`improv_serial` below provision them into NVS after
  # flashing (ESP Web Tools drives this in the browser); `ap:` is the
  # fallback hotspot for as long as no station network is configured yet
  # (or the last-known one is unreachable). WPA2 needs >= 8 chars; this
  # password is the same on every unit by construction (it is baked into
  # a public binary) and only protects the temporary setup-mode hotspot,
  # not the bridge or the panel's own dashboard — see README.md
  # "Security model".
  ap:
    ssid: "${friendly_name} Setup"
    password: "panelsetup"
  on_connect:
    - lvgl.label.update:
        id: wifi_status_label
        text: "WiFi: OK"
  on_disconnect:
    - lvgl.label.update:
        id: wifi_status_label
        text: "WiFi: --"

captive_portal:

# First-boot provisioning: Improv over BLE and/or the same USB-serial
# connection used for flashing, so ESP Web Tools can flash + provision
# Wi-Fi in one browser flow. authorizer: none — this panel has no
# physical confirmation button; anyone with local BLE/serial access
# during first boot can provision it. Acceptable for a LAN-only panel
# (see README.md "Security model").
esp32_improv:
  authorizer: none

improv_serial:

# Runtime dashboard: lets the bridge URL / bearer token `text` entities
# below (and Wi-Fi re-provisioning) be set from a browser pointed at the
# panel's own IP, no re-flash needed. `local: true` bundles the
# dashboard's JS/CSS in the firmware image itself instead of fetching
# them from esphome.io at runtime — consistent with this project's "no
# cloud dependencies for core functionality" principle (CLAUDE.md): the
# panel's own config UI must work from a browser with no other internet
# access than the LAN it shares with the panel.
web_server:
  version: 3
  local: true

http_request:
  id: http
  useragent: "esphome/cyd-scan-panel"
  timeout: 8s
  # Plain HTTP is intentional (LAN-only deployment) — see README.md
  # "Security model". If the bridge ever moves behind a TLS-terminating
  # proxy, set the Bridge URL text entity to https://... and remove this
  # (or point verify_ssl at a real CA).
  verify_ssl: false

json:

# ---------------------------------------------------------------------
# Runtime configuration. Replaces the v1 build-time `substitutions:` /
# `!secret` values for the bridge connection. Both entities persist to
# flash (`restore_value: true`) and are editable from the `web_server`
# dashboard above at the panel's IP — no re-flash needed to change
# either. Neither entity has an `initial_value`: both start empty on a
# freshly flashed, never-configured panel, which is exactly the state
# the guards in the scripts below check for (`state.empty()` ->
# "Bridge: not set"). Set both from the dashboard after flashing.
# ---------------------------------------------------------------------

text:
  - platform: template
    name: "Bridge URL"
    id: bridge_url
    optimistic: true
    restore_value: true
    mode: text
  - platform: template
    name: "Bridge Token"
    id: bridge_token
    optimistic: true
    restore_value: true
    mode: password

# ---------------------------------------------------------------------
# Grid size (Issue #9 item B1). Two persistent `number` entities, same
# runtime-configurable idiom as the `text` entities above (restore_value
# true, editable from the same `web_server` dashboard, no re-flash
# needed). `initial_value: 2` / `initial_value: 3` reproduce today's
# fixed 2x3 = 6-slot layout byte-for-byte on a freshly flashed panel —
# see `globals: grid_rows`/`grid_cols` below, which mirror these at
# `on_boot` and stay the actual source of truth the LVGL widget geometry
# lambdas read (decoupled from `number` restore timing on purpose: a
# plain `int` global with a compile-time `initial_value` is guaranteed
# ready before LVGL builds its widgets; whether `number.template`'s
# `restore_value` has already run its NVS read by that point in
# `setup()` is not something this firmware wants to depend on). Range
# 1..3 each — 3x3 is the largest grid the 9 static button slots below
# support; see `relayout_grid`/`render_page` in `script:`.
number:
  - platform: template
    name: "Grid Rows"
    id: grid_rows_cfg
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 1
    max_value: 3
    step: 1
    on_value:
      then:
        - lambda: "id(grid_rows) = (int) x;"
        - script.execute: relayout_grid
  - platform: template
    name: "Grid Cols"
    id: grid_cols_cfg
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 1
    max_value: 3
    step: 1
    on_value:
      then:
        - lambda: "id(grid_cols) = (int) x;"
        - script.execute: relayout_grid

# ---------------------------------------------------------------------
# Board bring-up: two independent SPI buses (mandatory on the CYD — the
# display and the touch controller are NOT on a shared bus), the
# ILI9341 display, the XPT2046 touch controller, the GPIO21 backlight,
# and the active-low RGB status LED.
# ---------------------------------------------------------------------

spi:
  - id: tft_spi
    clk_pin: 14
    mosi_pin: 13
    miso_pin:
      number: 12
      # GPIO12 is an ESP32 strapping pin (flash voltage select). The CYD
      # wires it to the display's MISO regardless; this only silences
      # ESPHome's strapping-pin warning, it does not change behavior.
      ignore_strapping_warning: true
  - id: touch_spi
    clk_pin: 25
    mosi_pin: 32
    miso_pin: 39

display:
  - platform: ili9xxx
    id: cyd_display
    model: ILI9341
    spi_id: tft_spi
    cs_pin:
      number: 15
      # GPIO15 is an ESP32 strapping pin (MTDO). Same rationale as
      # GPIO12 above.
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      # GPIO2 is also an ESP32 strapping pin. Confirmed by
      # `esphome config` (WARNING GPIO2 is a strapping PIN...) against
      # this exact config — not present in the source brief, added here
      # after seeing the real warning.
      ignore_strapping_warning: true
    invert_colors: false
    # No PSRAM on the WROOM-32 module used by the CYD — a 16-bit
    # framebuffer does not fit. 8BIT is the palette mode that does.
    color_palette: 8BIT
    # LVGL owns rendering; a periodic full-screen redraw would fight it.
    auto_clear_enabled: false
    update_interval: never
    # Stays hardcoded at 0 regardless of orientation — see the
    # `substitutions:` comment above. ESPHome's validator rejects a
    # non-zero value here once `lvgl:` is configured ("set rotation in
    # the LVGL config instead"); `lvgl.rotation` below is where the
    # portrait override actually rotates the panel.
    rotation: 0
    dimensions:
      # ESPHome's ili9xxx docs: "the dimensions are those of the final
      # display" — i.e. these must already be the ROTATED (post-`lvgl.
      # rotation`) width/height, not the panel's physical/native ones.
      # For the 90°-portrait override this means 240x320 (swapped), kept
      # in lockstep with `lvgl.rotation` via the substitutions above so
      # the two can never drift apart independently.
      width: ${screen_width}
      height: ${screen_height}

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: touch_spi
    cs_pin: 33
    interrupt_pin: 36
    threshold: 400
    # Placeholder calibration — every panel is different out of the
    # factory. MUST be re-calibrated per physical unit after first
    # flash; see README.md "Touch calibration". Read from the
    # substitutions above so a portrait override (Issue #9 item B4) can
    # ship its own placeholder starting point — still just a starting
    # point, recalibration is mandatory in either orientation.
    calibration:
      x_min: ${touch_x_min}
      x_max: ${touch_x_max}
      y_min: ${touch_y_min}
      y_max: ${touch_y_max}
    transform:
      swap_xy: ${touch_swap_xy}

output:
  # Backlight: GPIO21, active-HIGH. Wrapped in a monochromatic light
  # with restore_mode ALWAYS_ON below — without that the screen is
  # black after every reboot (light components default to OFF).
  - platform: ledc
    id: backlight_pwm_output
    pin: 21
  # RGB status LED, active-LOW (CYD wiring) — each channel inverted.
  - platform: ledc
    id: led_red_output
    pin:
      number: 4
      inverted: true
  - platform: ledc
    id: led_green_output
    pin:
      number: 16
      inverted: true
  - platform: ledc
    id: led_blue_output
    pin:
      number: 17
      inverted: true

light:
  - platform: monochromatic
    id: panel_backlight
    name: "Panel Backlight"
    output: backlight_pwm_output
    restore_mode: ALWAYS_ON
  - platform: rgb
    id: status_led
    name: "Panel Status LED"
    red: led_red_output
    green: led_green_output
    blue: led_blue_output
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------
# Runtime state. Kept as plain globals ("the firmware stays dumb", per
# the API design in Issue #9) — no client-side sorting/filtering, the
# bridge already returns profiles in the order to display.
#
# Grid size (B1) and paging (B2): `grid_rows`/`grid_cols` are the source
# of truth the 9 static LVGL button slots' x/y/width/height lambdas
# read — a plain `int` global with a compile-time `initial_value` (not
# the `grid_rows_cfg`/`grid_cols_cfg` `number` entities' `.state`
# directly), so widget geometry never depends on whether `number`'s
# `restore_value` has already run by the time LVGL builds its widgets.
# `all_profile_names`/`all_profile_descs` hold every profile the bridge
# returned (capped defensively, see `refresh_profiles`); the 9
# `slot_name_N`/`slot_desc_N` globals below hold only the current page's
# slice, filled by `render_page`. `ui_ready` guards `relayout_grid`
# against running before LVGL has actually constructed the 9 button
# widgets — see the `on_boot` comment.
#
# `screen_width`/`screen_height` (Issue #9 item B4) are this same
# compile-time-`initial_value`-global idiom applied to the grid geometry
# lambdas in `relayout_grid` below, which until now read the display's
# 320x240 landscape dimensions as two hardcoded literals. Reading them
# from globals instead — mirroring `grid_rows`/`grid_cols` above, sourced
# from the `screen_width`/`screen_height` substitutions rather than a
# `number` entity's `.state` — keeps the grid's column/row math correct
# for whatever `display.dimensions` the current build was compiled with,
# landscape or the portrait override, with no separate flag to keep in
# sync.
# ---------------------------------------------------------------------

globals:
  - id: ui_ready
    type: bool
    restore_value: false
    initial_value: "false"
  - id: grid_rows
    type: int
    restore_value: false
    initial_value: "2"
  - id: grid_cols
    type: int
    restore_value: false
    initial_value: "3"
  - id: screen_width
    type: int
    restore_value: false
    initial_value: "${screen_width}"
  - id: screen_height
    type: int
    restore_value: false
    initial_value: "${screen_height}"
  - id: slot_name_0
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_1
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_2
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_3
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_4
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_5
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_6
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_7
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_8
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_0
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_1
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_2
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_3
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_4
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_5
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_6
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_7
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_8
    type: std::string
    restore_value: false
    initial_value: '""'
  # Every profile the bridge returned (not just the current page). No
  # `initial_value:` on purpose — `std::vector<std::string>` has no
  # unambiguous single-argument constructor for an "empty vector"
  # literal here (`initial_value: "{}"` makes `esphome compile` fail
  # with "call of overloaded ... is ambiguous"; verified against this
  # exact ESPHome version). Omitting `initial_value` makes ESPHome
  # codegen the no-args constructor instead, which default-constructs
  # an empty vector — unambiguous and exactly what's needed.
  - id: all_profile_names
    type: std::vector<std::string>
    restore_value: false
  - id: all_profile_descs
    type: std::vector<std::string>
    restore_value: false
  - id: total_profile_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: page_offset
    type: int
    restore_value: false
    initial_value: "0"
  - id: page_visible_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: selected_profile
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: scan_in_progress
    type: bool
    restore_value: false
    initial_value: "false"
  - id: bridge_reachable
    type: bool
    restore_value: false
    initial_value: "false"
  # ready_http_status/ready_error_code (Issue #9 item B6) mirror
  # scan_http_status/scan_error_code below, but for GET /ready in
  # check_bridge_health rather than POST /scan in do_scan — same reason:
  # capture_response's on_response lambda and the follow-up branching
  # if:s are separate script steps, so the parsed status/error need a
  # global to survive between them.
  - id: ready_http_status
    type: int
    restore_value: false
    initial_value: "0"
  - id: ready_error_code
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: scan_http_status
    type: int
    restore_value: false
    initial_value: "0"
  - id: scan_error_code
    type: std::string
    restore_value: false
    initial_value: '""'
  # http_request's `url:` and `request_headers:` templatable fields
  # compile down to a `const char *` return, not `std::string` (confirmed
  # by `esphome compile`, not just `esphome config` — the two do not
  # catch the same bugs). Returning `.c_str()` off a temporary built
  # in-place in the same return statement would dangle: the temporary is
  # destroyed at the end of that full expression, before the caller
  # reads the pointer. These globals give each computed URL/header a
  # lifetime that outlives the return — set one lambda action ahead of
  # the http_request action that reads it, never across a `delay:`.
  - id: profiles_url
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: profiles_auth
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: ready_url
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: scan_url
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: scan_auth
    type: std::string
    restore_value: false
    initial_value: '""'

# ---------------------------------------------------------------------
# scan-bridge HTTP calls. Kept as scripts so both on_boot and the
# interval triggers below share one code path.
# ---------------------------------------------------------------------

script:
  - id: refresh_profiles
    mode: restart
    then:
      # Nothing to fetch without both a bridge URL and a bearer token —
      # skip the request rather than firing it at an empty/default
      # target. Slots simply stay hidden (total_profile_count stays at
      # its initial 0) until both are set from the web_server dashboard.
      - if:
          condition:
            lambda: "return !id(bridge_url).state.empty() && !id(bridge_token).state.empty();"
          then:
            - lambda: |-
                id(profiles_url) = id(bridge_url).state + "/profiles";
                id(profiles_auth) = std::string("Bearer ") + id(bridge_token).state;
            - http_request.get:
                url: !lambda 'return id(profiles_url).c_str();'
                request_headers:
                  Authorization: !lambda 'return id(profiles_auth).c_str();'
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("panel", "GET /profiles failed: %d", response->status_code);
                          return;
                        }
                        json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["profiles"].is<JsonArray>()) {
                            ESP_LOGW("panel", "GET /profiles: unexpected body shape");
                            return false;
                          }
                          JsonArray arr = root["profiles"];
                          // Cap defensively — the 9 static button slots
                          // can only ever show one page's worth at a
                          // time (up to 3x3), but `render_page` walks
                          // this whole vector's `.size()` to compute
                          // page count, so an unbounded bridge response
                          // must not be able to grow it unbounded too.
                          const size_t cap = 100;
                          size_t count = arr.size() < cap ? arr.size() : cap;
                          id(total_profile_count) = static_cast<int>(count);
                          id(all_profile_names).clear();
                          id(all_profile_descs).clear();
                          id(all_profile_names).reserve(count);
                          id(all_profile_descs).reserve(count);
                          for (size_t i = 0; i < count; i++) {
                            JsonObject p = arr[i];
                            id(all_profile_names).push_back(p["name"] | std::string(""));
                            id(all_profile_descs).push_back(p["description"] | std::string(""));
                          }
                          return true;
                        });
                    # Apply the just-parsed profile list to the grid.
                    # Split out of the parsing lambda above on purpose —
                    # see the PR description for why (LVGL widget
                    # updates go through the documented lvgl.* actions,
                    # not raw pointers from inside a JSON-parsing
                    # callback). `relayout_grid` first (re-applies
                    # geometry in case `grid_rows`/`grid_cols` changed
                    # since the last fetch) then `render_page` (clamps
                    # `page_offset` against the possibly-changed
                    # `total_profile_count` and repaints the current
                    # page) — `relayout_grid` also calls `render_page`
                    # itself at its own end, so this second explicit
                    # call re-runs the same deterministic computation
                    # against unchanged state; harmless, and keeps both
                    # scripts' triggers exactly as documented in the PR
                    # description rather than relying on the chaining
                    # being obvious from reading `relayout_grid` alone.
                    - script.execute: relayout_grid
                    - script.execute: render_page
                on_error:
                  then:
                    - lambda: 'ESP_LOGW("panel", "GET /profiles: request failed");'

  # Repositions/resizes the 9 static button slots for the current
  # `grid_rows`x`grid_cols` (B1). Triggered from `grid_rows_cfg`'s and
  # `grid_cols_cfg`'s `on_value` and from the end of `refresh_profiles`
  # above. Geometry-only: hiding/showing individual slots and filling
  # their text is `render_page`'s job (called at the end of this
  # script, since a grid-size change also changes how many profiles fit
  # per page and which slice of `all_profile_names`/`all_profile_descs`
  # is "the current page").
  #
  # `col_w` divides `id(screen_width)` (B4: the compile-time
  # `screen_width`/`screen_height` substitution, not a hardcoded 320) by
  # the column count; `row_h` divides `id(screen_height) - 46`, where 46
  # is the fixed chrome this grid does NOT occupy — the 22px header, the
  # 20px footer, and 4px of edge gap between them and the grid — so it
  # stays 46 in both orientations even though `screen_height` itself
  # changes (240 landscape, 320 portrait). The header/footer widgets
  # themselves are NOT parameterized by orientation (out of scope for
  # B4 — see README.md "Display orientation"); only the grid they bound
  # is.
