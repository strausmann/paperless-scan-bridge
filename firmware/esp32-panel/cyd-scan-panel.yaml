# ESPHome firmware for the ESP32-2432S028R ("Cheap Yellow Display" / CYD)
# scan-control panel — Issue #9.
#
# v2 scope: secret-free, runtime configuration. This firmware carries no
# Wi-Fi credentials, bridge URL, or bearer token at build time — it ships
# as one public binary via the browser-based ESP Web Tools installer
# (Issue #9, phase E). Wi-Fi is provisioned in-browser via Improv right
# after flashing; the bridge URL and bearer token are `text` entities
# held in flash (NVS) and set from the panel's own `web_server`
# dashboard afterwards. Fixed 6-button landscape grid populated at
# runtime from GET /profiles, tap-to-scan via POST /scan. See README.md
# for flashing, the mandatory post-flash touch calibration, and known
# limitations.
#
# Hardware bring-up values below (pins, SPI buses, display/touch options)
# are cross-verified for the ESP32-2432S028R and must not be changed
# without re-verifying against the board's actual wiring — this is the one
# widely-cloned "CYD" board revision this firmware targets.

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "paperless-scan-bridge CYD scan-control panel (v2, Issue #9, secret-free)"
  min_version: "2024.5.0"
  on_boot:
    priority: -100
    then:
      - script.execute: refresh_profiles
      - script.execute: check_bridge_health

esp32:
  board: esp32dev
  framework:
    type: arduino

substitutions:
  name: cyd-scan-panel
  friendly_name: "Scan Panel"

logger:
  baud_rate: 115200

# No `api:` block. This build carries no fixed native-API encryption key
# (a public binary cannot embed a per-device secret), and the panel does
# not need Home Assistant discovery — it is purely an HTTP client of the
# scan-bridge (see README.md "Security model"). `web_server:` below does
# not require `api:` to be present.

# OTA with no fixed password: a public binary cannot ship a shared
# secret either, and per-device OTA passwords are out of scope for v2
# (no on-device way to set one before the first flash). OTA is therefore
# LAN-trust, same posture as the plain-HTTP bridge token below — see
# README.md "Security model". Re-flashing over USB via the same
# installer page is always available regardless.
ota:
  - platform: esphome

wifi:
  # No `ssid:`/`password:` here on purpose — this is the whole point of
  # "secret-free": Wi-Fi station credentials are never build-time values.
  # `esp32_improv`/`improv_serial` below provision them into NVS after
  # flashing (ESP Web Tools drives this in the browser); `ap:` is the
  # fallback hotspot for as long as no station network is configured yet
  # (or the last-known one is unreachable). WPA2 needs >= 8 chars; this
  # password is the same on every unit by construction (it is baked into
  # a public binary) and only protects the temporary setup-mode hotspot,
  # not the bridge or the panel's own dashboard — see README.md
  # "Security model".
  ap:
    ssid: "${friendly_name} Setup"
    password: "panelsetup"
  on_connect:
    - lvgl.label.update:
        id: wifi_status_label
        text: "WiFi: OK"
  on_disconnect:
    - lvgl.label.update:
        id: wifi_status_label
        text: "WiFi: --"

captive_portal:

# First-boot provisioning: Improv over BLE and/or the same USB-serial
# connection used for flashing, so ESP Web Tools can flash + provision
# Wi-Fi in one browser flow. authorizer: none — this panel has no
# physical confirmation button; anyone with local BLE/serial access
# during first boot can provision it. Acceptable for a LAN-only panel
# (see README.md "Security model").
esp32_improv:
  authorizer: none

improv_serial:

# Runtime dashboard: lets the bridge URL / bearer token `text` entities
# below (and Wi-Fi re-provisioning) be set from a browser pointed at the
# panel's own IP, no re-flash needed. `local: true` bundles the
# dashboard's JS/CSS in the firmware image itself instead of fetching
# them from esphome.io at runtime — consistent with this project's "no
# cloud dependencies for core functionality" principle (CLAUDE.md): the
# panel's own config UI must work from a browser with no other internet
# access than the LAN it shares with the panel.
web_server:
  version: 3
  local: true

http_request:
  id: http
  useragent: "esphome/cyd-scan-panel"
  timeout: 8s
  # Plain HTTP is intentional (LAN-only deployment) — see README.md
  # "Security model". If the bridge ever moves behind a TLS-terminating
  # proxy, set the Bridge URL text entity to https://... and remove this
  # (or point verify_ssl at a real CA).
  verify_ssl: false

json:

# ---------------------------------------------------------------------
# Runtime configuration. Replaces the v1 build-time `substitutions:` /
# `!secret` values for the bridge connection. Both entities persist to
# flash (`restore_value: true`) and are editable from the `web_server`
# dashboard above at the panel's IP — no re-flash needed to change
# either. `initial_value` on Bridge URL is a convenience default for
# this project's own LAN, not a secret; every flasher is expected to
# change it. Bridge Token has no `initial_value` — it starts empty on a
# freshly flashed, never-configured panel, which is exactly the state
# the guards in the scripts below check for.
# ---------------------------------------------------------------------

text:
  - platform: template
    name: "Bridge URL"
    id: bridge_url
    optimistic: true
    restore_value: true
    initial_value: "http://hhplex01:18080"
    mode: text
  - platform: template
    name: "Bridge Token"
    id: bridge_token
    optimistic: true
    restore_value: true
    mode: password

# ---------------------------------------------------------------------
# Board bring-up: two independent SPI buses (mandatory on the CYD — the
# display and the touch controller are NOT on a shared bus), the
# ILI9341 display, the XPT2046 touch controller, the GPIO21 backlight,
# and the active-low RGB status LED.
# ---------------------------------------------------------------------

spi:
  - id: tft_spi
    clk_pin: 14
    mosi_pin: 13
    miso_pin:
      number: 12
      # GPIO12 is an ESP32 strapping pin (flash voltage select). The CYD
      # wires it to the display's MISO regardless; this only silences
      # ESPHome's strapping-pin warning, it does not change behavior.
      ignore_strapping_warning: true
  - id: touch_spi
    clk_pin: 25
    mosi_pin: 32
    miso_pin: 39

display:
  - platform: ili9xxx
    id: cyd_display
    model: ILI9341
    spi_id: tft_spi
    cs_pin:
      number: 15
      # GPIO15 is an ESP32 strapping pin (MTDO). Same rationale as
      # GPIO12 above.
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      # GPIO2 is also an ESP32 strapping pin. Confirmed by
      # `esphome config` (WARNING GPIO2 is a strapping PIN...) against
      # this exact config — not present in the source brief, added here
      # after seeing the real warning.
      ignore_strapping_warning: true
    invert_colors: false
    # No PSRAM on the WROOM-32 module used by the CYD — a 16-bit
    # framebuffer does not fit. 8BIT is the palette mode that does.
    color_palette: 8BIT
    # LVGL owns rendering; a periodic full-screen redraw would fight it.
    auto_clear_enabled: false
    update_interval: never
    rotation: 0
    dimensions:
      width: 320
      height: 240

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: touch_spi
    cs_pin: 33
    interrupt_pin: 36
    threshold: 400
    # Placeholder calibration — every panel is different out of the
    # factory. MUST be re-calibrated per physical unit after first
    # flash; see README.md "Touch calibration".
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true

output:
  # Backlight: GPIO21, active-HIGH. Wrapped in a monochromatic light
  # with restore_mode ALWAYS_ON below — without that the screen is
  # black after every reboot (light components default to OFF).
  - platform: ledc
    id: backlight_pwm_output
    pin: 21
  # RGB status LED, active-LOW (CYD wiring) — each channel inverted.
  - platform: ledc
    id: led_red_output
    pin:
      number: 4
      inverted: true
  - platform: ledc
    id: led_green_output
    pin:
      number: 16
      inverted: true
  - platform: ledc
    id: led_blue_output
    pin:
      number: 17
      inverted: true

light:
  - platform: monochromatic
    id: panel_backlight
    name: "Panel Backlight"
    output: backlight_pwm_output
    restore_mode: ALWAYS_ON
  - platform: rgb
    id: status_led
    name: "Panel Status LED"
    red: led_red_output
    green: led_green_output
    blue: led_blue_output
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------
# Runtime state. Kept as plain globals ("the firmware stays dumb", per
# the API design in Issue #9) — no client-side sorting/filtering, the
# bridge already returns profiles in the order to display.
# ---------------------------------------------------------------------

globals:
  - id: profile_count
    type: int
    restore_value: false
    initial_value: "0"
  - id: slot_name_0
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_1
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_2
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_3
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_4
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_name_5
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_0
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_1
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_2
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_3
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_4
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: slot_desc_5
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: selected_profile
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: scan_in_progress
    type: bool
    restore_value: false
    initial_value: "false"
  - id: bridge_reachable
    type: bool
    restore_value: false
    initial_value: "false"
  - id: scan_http_status
    type: int
    restore_value: false
    initial_value: "0"
  - id: scan_error_code
    type: std::string
    restore_value: false
    initial_value: '""'
  # http_request's `url:` and `request_headers:` templatable fields
  # compile down to a `const char *` return, not `std::string` (confirmed
  # by `esphome compile`, not just `esphome config` — the two do not
  # catch the same bugs). Returning `.c_str()` off a temporary built
  # in-place in the same return statement would dangle: the temporary is
  # destroyed at the end of that full expression, before the caller
  # reads the pointer. These globals give each computed URL/header a
  # lifetime that outlives the return — set one lambda action ahead of
  # the http_request action that reads it, never across a `delay:`.
  - id: profiles_url
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: profiles_auth
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: health_url
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: scan_url
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: scan_auth
    type: std::string
    restore_value: false
    initial_value: '""'

# ---------------------------------------------------------------------
# scan-bridge HTTP calls. Kept as scripts so both on_boot and the
# interval triggers below share one code path.
# ---------------------------------------------------------------------

script:
  - id: refresh_profiles
    mode: restart
    then:
      # Nothing to fetch without both a bridge URL and a bearer token —
      # skip the request rather than firing it at an empty/default
      # target. Slots simply stay hidden (profile_count stays at its
      # initial 0) until both are set from the web_server dashboard.
      - if:
          condition:
            lambda: "return !id(bridge_url).state.empty() && !id(bridge_token).state.empty();"
          then:
            - lambda: |-
                id(profiles_url) = id(bridge_url).state + "/profiles";
                id(profiles_auth) = std::string("Bearer ") + id(bridge_token).state;
            - http_request.get:
                url: !lambda 'return id(profiles_url).c_str();'
                request_headers:
                  Authorization: !lambda 'return id(profiles_auth).c_str();'
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("panel", "GET /profiles failed: %d", response->status_code);
                          return;
                        }
                        json::parse_json(body, [](JsonObject root) -> bool {
                          if (!root["profiles"].is<JsonArray>()) {
                            ESP_LOGW("panel", "GET /profiles: unexpected body shape");
                            return false;
                          }
                          JsonArray arr = root["profiles"];
                          const size_t max_slots = 6;
                          size_t count = arr.size() < max_slots ? arr.size() : max_slots;
                          id(profile_count) = static_cast<int>(count);

                          std::string names[max_slots];
                          std::string descs[max_slots];
                          for (size_t i = 0; i < count; i++) {
                            JsonObject p = arr[i];
                            names[i] = p["name"] | std::string("");
                            descs[i] = p["description"] | std::string("");
                          }
                          id(slot_name_0) = count > 0 ? names[0] : "";
                          id(slot_name_1) = count > 1 ? names[1] : "";
                          id(slot_name_2) = count > 2 ? names[2] : "";
                          id(slot_name_3) = count > 3 ? names[3] : "";
                          id(slot_name_4) = count > 4 ? names[4] : "";
                          id(slot_name_5) = count > 5 ? names[5] : "";
                          id(slot_desc_0) = count > 0 ? descs[0] : "";
                          id(slot_desc_1) = count > 1 ? descs[1] : "";
                          id(slot_desc_2) = count > 2 ? descs[2] : "";
                          id(slot_desc_3) = count > 3 ? descs[3] : "";
                          id(slot_desc_4) = count > 4 ? descs[4] : "";
                          id(slot_desc_5) = count > 5 ? descs[5] : "";
                          return true;
                        });
                    # Push the parsed globals into the fixed LVGL slots.
                    # Split out of the parsing lambda above on purpose —
                    # see the PR description for why (LVGL widget
                    # updates go through the documented lvgl.* actions,
                    # not raw pointers from inside a JSON-parsing
                    # callback).
                    - lvgl.widget.update:
                        id: slot0_btn
                        hidden: !lambda "return id(profile_count) < 1;"
                    - lvgl.label.update:
                        id: slot0_label
                        text: !lambda "return id(slot_name_0);"
                    - lvgl.label.update:
                        id: slot0_sub_label
                        text: !lambda "return id(slot_desc_0);"
                    - lvgl.widget.update:
                        id: slot1_btn
                        hidden: !lambda "return id(profile_count) < 2;"
                    - lvgl.label.update:
                        id: slot1_label
                        text: !lambda "return id(slot_name_1);"
                    - lvgl.label.update:
                        id: slot1_sub_label
                        text: !lambda "return id(slot_desc_1);"
                    - lvgl.widget.update:
                        id: slot2_btn
                        hidden: !lambda "return id(profile_count) < 3;"
                    - lvgl.label.update:
                        id: slot2_label
                        text: !lambda "return id(slot_name_2);"
                    - lvgl.label.update:
                        id: slot2_sub_label
                        text: !lambda "return id(slot_desc_2);"
                    - lvgl.widget.update:
                        id: slot3_btn
                        hidden: !lambda "return id(profile_count) < 4;"
                    - lvgl.label.update:
                        id: slot3_label
                        text: !lambda "return id(slot_name_3);"
                    - lvgl.label.update:
                        id: slot3_sub_label
                        text: !lambda "return id(slot_desc_3);"
                    - lvgl.widget.update:
                        id: slot4_btn
                        hidden: !lambda "return id(profile_count) < 5;"
                    - lvgl.label.update:
                        id: slot4_label
                        text: !lambda "return id(slot_name_4);"
                    - lvgl.label.update:
                        id: slot4_sub_label
                        text: !lambda "return id(slot_desc_4);"
                    - lvgl.widget.update:
                        id: slot5_btn
                        hidden: !lambda "return id(profile_count) < 6;"
                    - lvgl.label.update:
                        id: slot5_label
                        text: !lambda "return id(slot_name_5);"
                    - lvgl.label.update:
                        id: slot5_sub_label
                        text: !lambda "return id(slot_desc_5);"
                on_error:
                  then:
                    - lambda: 'ESP_LOGW("panel", "GET /profiles: request failed");'

  - id: check_bridge_health
    mode: restart
    then:
      # Health has no auth requirement (see ADR-0006 / README "Security
      # model") — only the bridge URL matters here, not the token. An
      # empty token still shows "Bridge: OK" if the URL answers; the
      # profile grid simply stays empty until a token is set too (see
      # refresh_profiles above).
      - if:
          condition:
            lambda: "return !id(bridge_url).state.empty();"
          then:
            - lambda: 'id(health_url) = id(bridge_url).state + "/health";'
            - http_request.get:
                url: !lambda 'return id(health_url).c_str();'
                capture_response: false
                on_response:
                  then:
                    - lambda: "id(bridge_reachable) = (response->status_code == 200);"
                    - if:
                        condition:
                          lambda: "return id(bridge_reachable);"
                        then:
                          - lvgl.label.update:
                              id: bridge_status_label
                              text: "Bridge: OK"
                        else:
                          - lvgl.label.update:
                              id: bridge_status_label
                              text: "Bridge: ERR"
                on_error:
                  then:
                    - lambda: "id(bridge_reachable) = false;"
                    - lvgl.label.update:
                        id: bridge_status_label
                        text: "Bridge: --"
          else:
            - lambda: "id(bridge_reachable) = false;"
            - lvgl.label.update:
                id: bridge_status_label
                text: "Bridge: not set"

  - id: do_scan
    mode: single
    then:
      # Defense in depth: the six buttons are only unhidden once
      # refresh_profiles has populated them, which itself requires both
      # values to be non-empty — so this path should be unreachable via
      # the touchscreen. Still checked here directly (not just relying
      # on button visibility) in case a stale profile_count from a
      # previous configuration is ever tapped mid-reconfiguration.
      - if:
          condition:
            lambda: "return id(bridge_url).state.empty() || id(bridge_token).state.empty();"
          then:
            - lvgl.label.update: { id: status_label, text: "Bridge not configured" }
            - delay: 2s
            - lvgl.label.update: { id: status_label, text: "idle" }
          else:
            - lambda: "id(scan_in_progress) = true;"
            - lvgl.widget.update: { id: slot0_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot1_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot2_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot3_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot4_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot5_btn, state: { disabled: true } }
            - light.turn_on:
                id: status_led
                red: 100%
                green: 65%
                blue: 0%
            - lvgl.label.update:
                id: status_label
                text: !lambda 'return std::string("Scanning: ") + id(selected_profile) + "...";'
            - lambda: |-
                id(scan_url) = id(bridge_url).state + "/scan";
                id(scan_auth) = std::string("Bearer ") + id(bridge_token).state;
            - http_request.post:
                url: !lambda 'return id(scan_url).c_str();'
                request_headers:
                  Authorization: !lambda 'return id(scan_auth).c_str();'
                json:
                  profile: !lambda "return id(selected_profile);"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        id(scan_http_status) = response->status_code;
                        id(scan_error_code) = "";
                        if (response->status_code != 200) {
                          json::parse_json(body, [](JsonObject root) -> bool {
                            if (root["error"].is<const char *>()) {
                              id(scan_error_code) = root["error"].as<std::string>();
                            }
                            return true;
                          });
                        }
                    # Every branch below resets the LED and status label
                    # back to idle after a delay — not just the 200
                    # branch (was Review-Fund PR #31: only success used
                    # to reset; error/timeout states stayed on-screen
                    # forever until the next scan attempt). Errors get
                    # a longer delay (4s) than success (2s, unchanged)
                    # so there is time to actually read the message.
                    - if:
                        condition:
                          lambda: "return id(scan_http_status) == 200;"
                        then:
                          - light.turn_on: { id: status_led, red: 0%, green: 100%, blue: 0% }
                          - lvgl.label.update:
                              id: status_label
                              text: !lambda 'return std::string("Done: ") + id(selected_profile);'
                          - delay: 2s
                          - light.turn_off: status_led
                          - lvgl.label.update: { id: status_label, text: "idle" }
                    - if:
                        condition:
                          lambda: "return id(scan_http_status) == 422;"
                        then:
                          - light.turn_on: { id: status_led, red: 100%, green: 40%, blue: 0% }
                          - lvgl.label.update: { id: status_label, text: "No paper in feeder" }
                          - delay: 4s
                          - light.turn_off: status_led
                          - lvgl.label.update: { id: status_label, text: "idle" }
                    - if:
                        condition:
                          lambda: "return id(scan_http_status) == 401 || id(scan_http_status) == 403;"
                        then:
                          - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0% }
                          - lvgl.label.update: { id: status_label, text: "Unauthorized — check Bridge Token" }
                          - delay: 4s
                          - light.turn_off: status_led
                          - lvgl.label.update: { id: status_label, text: "idle" }
                    - if:
                        condition:
                          lambda: "return id(scan_http_status) == 404;"
                        then:
                          - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0% }
                          - lvgl.label.update: { id: status_label, text: "Unknown profile" }
                          - delay: 4s
                          - light.turn_off: status_led
                          - lvgl.label.update: { id: status_label, text: "idle" }
                    - if:
                        condition:
                          lambda: |-
                            return id(scan_http_status) != 200
                                && id(scan_http_status) != 422
                                && id(scan_http_status) != 401
                                && id(scan_http_status) != 403
                                && id(scan_http_status) != 404;
                        then:
                          - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0% }
                          - lvgl.label.update:
                              id: status_label
                              text: !lambda 'return std::string("Error ") + std::to_string(id(scan_http_status));'
                          - delay: 4s
                          - light.turn_off: status_led
                          - lvgl.label.update: { id: status_label, text: "idle" }
                    - lambda: "id(scan_in_progress) = false;"
                    - lvgl.widget.update: { id: slot0_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot1_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot2_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot3_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot4_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot5_btn, state: { disabled: false } }
                on_error:
                  then:
                    - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0% }
                    - lvgl.label.update: { id: status_label, text: "Bridge unreachable" }
                    - delay: 4s
                    - light.turn_off: status_led
                    - lvgl.label.update: { id: status_label, text: "idle" }
                    - lambda: "id(scan_in_progress) = false;"
                    - lvgl.widget.update: { id: slot0_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot1_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot2_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot3_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot4_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot5_btn, state: { disabled: false } }

interval:
  - interval: 30s
    then:
      - script.execute: refresh_profiles
  - interval: 15s
    then:
      - script.execute: check_bridge_health

# ---------------------------------------------------------------------
# UI: fixed landscape 320x240 layout. Widgets are declared once with
# explicit x/y/width/height (no flex/grid layout engine) so the six
# button slots are predictable; content is filled at runtime by
# refresh_profiles above via lvgl.label.update / lvgl.widget.update.
# Portrait is a later option (see README.md).
# ---------------------------------------------------------------------

lvgl:
  displays:
    - cyd_display
  touchscreens:
    - cyd_touch
  pages:
    - id: main_page
      widgets:
        - obj:
            x: 0
            y: 0
            width: 320
            height: 22
            pad_all: 0
            border_width: 0
            widgets:
              - label:
                  id: title_label
                  x: 4
                  y: 2
                  text: "Scan Profiles"
              - label:
                  id: wifi_status_label
                  x: 130
                  y: 2
                  text: "WiFi: --"
              - label:
