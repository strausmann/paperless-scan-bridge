  - id: check_bridge_health
    mode: restart
    then:
      # GET /ready (Issue #9 item B6) replaces the old plain GET
      # /health. /ready is a strict superset for the "is the process
      # even up" question: if the bridge is down, /ready fails at the
      # network level exactly like /health did — the on_error branch
      # below is unchanged in spirit. The new value is the JSON body a
      # running bridge sends when it is up but not (yet) ready to serve
      # POST /scan — see
      # components/scan-bridge/internal/api/ready.go, whose handler
      # this mirrors:
      #   - 200 {"status":"ready"}: profiles loaded AND sane-runtime
      #     answered its own health check. GREEN.
      #   - 503 {"error":"sane_runtime_unreachable"}: the bridge process
      #     itself IS reachable, only the scanner backend specifically
      #     is down. Its own BLUE state, deliberately not lumped in with
      #     a generic error — a flasher standing in front of the panel
      #     can tell "restart sane-runtime" apart from "bridge is
      #     unreachable/misconfigured" at a glance.
      #   - 503 {"error":"no_profiles_loaded"}, or any other/unexpected
      #     status: the bridge answered but is otherwise not ready. RED.
      # Auth: no bearer token needed for /ready, same as /health before
      # it (see ADR-0006 / README "Security model") — only the bridge
      # URL matters here. An empty token still drives the indicator; the
      # profile grid simply stays empty until a token is set too (see
      # refresh_profiles above).
      - if:
          condition:
            lambda: "return !id(bridge_url).state.empty();"
          then:
            - lambda: 'id(ready_url) = id(bridge_url).state + "/ready";'
            - http_request.get:
                url: !lambda 'return id(ready_url).c_str();'
                capture_response: true
                on_response:
                  then:
                    # Any HTTP response at all — 200 or a 503 with a
                    # body — means the bridge process answered; only
                    # on_error below (a network-level failure) means it
                    # did not. Parsed the same way do_scan's on_response
                    # parses its error body: json::parse_json +
                    # root["error"], guarded by is<const char *>() so a
                    # missing/malformed field never throws.
                    - lambda: |-
                        id(bridge_reachable) = true;
                        id(ready_http_status) = response->status_code;
                        id(ready_error_code) = "";
                        if (response->status_code != 200) {
                          json::parse_json(body, [](JsonObject root) -> bool {
                            if (root["error"].is<const char *>()) {
                              id(ready_error_code) = root["error"].as<std::string>();
                            }
                            return true;
                          });
                        }
                    - if:
                        condition:
                          lambda: "return id(ready_http_status) == 200;"
                        then:
                          - lvgl.label.update:
                              id: bridge_status_label
                              text: "Bridge: OK"
                              text_color: 0x00A000
                    - if:
                        condition:
                          lambda: |-
                            return id(ready_http_status) == 503
                                && id(ready_error_code) == "sane_runtime_unreachable";
                        then:
                          - lvgl.label.update:
                              id: bridge_status_label
                              text: "Scanner: offline"
                              text_color: 0x0080FF
                    - if:
                        condition:
                          lambda: |-
                            return id(ready_http_status) != 200
                                && !(id(ready_http_status) == 503
                                     && id(ready_error_code) == "sane_runtime_unreachable");
                        then:
                          - lvgl.label.update:
                              id: bridge_status_label
                              text: "Bridge: ERR"
                              text_color: 0xE00000
                on_error:
                  then:
                    - lambda: "id(bridge_reachable) = false;"
                    - lvgl.label.update:
                        id: bridge_status_label
                        text: "Bridge: --"
                        text_color: 0xE00000
          else:
            # Not one of the three /ready-driven states — no URL is
            # configured yet, so no request was even attempted. Colored
            # the same RED as the network-unreachable case above: from a
            # "can the panel scan right now" standpoint both mean no,
            # and adding a fifth (e.g. neutral/gray) color for this
            # pre-configuration state is out of scope for B6, whose
            # DONE-when criteria names exactly three /ready-driven
            # colors.
            - lambda: "id(bridge_reachable) = false;"
            - lvgl.label.update:
                id: bridge_status_label
                text: "Bridge: not set"
                text_color: 0xE00000

  - id: render_page
    mode: restart
    then:
      # Single authoritative "paint the current page" step. Clamps
      # `page_offset` first (defensive — covers both a `refresh_profiles`
      # that shrunk `total_profile_count` and a grid-size change that
      # shrunk `page_size`), then slices `all_profile_names`/
      # `all_profile_descs` into the 9 `slot_name_N`/`slot_desc_N`
      # globals for this page (blank beyond the page's actual profile
      # count). The label/hidden/prev-next updates below read the
      # result — kept as separate lvgl.* actions on purpose, same
      # reasoning as the split in refresh_profiles above.
      - lambda: |-
          int rows = id(grid_rows);
          int cols = id(grid_cols);
          if (rows < 1) rows = 1;
          if (rows > 3) rows = 3;
          if (cols < 1) cols = 1;
          if (cols > 3) cols = 3;
          int page_size = rows * cols;
          int total = id(total_profile_count);
          int max_page = total > 0 ? (total - 1) / page_size : 0;
          if (id(page_offset) > max_page) id(page_offset) = max_page;
          if (id(page_offset) < 0) id(page_offset) = 0;
          int start = id(page_offset) * page_size;
          int remaining = total - start;
          int visible = remaining < 0 ? 0 : (remaining < page_size ? remaining : page_size);
          id(page_visible_count) = visible;
          std::string blank = "";
          id(slot_name_0) = (0 < visible) ? id(all_profile_names)[start + 0] : blank;
          id(slot_desc_0) = (0 < visible) ? id(all_profile_descs)[start + 0] : blank;
          id(slot_name_1) = (1 < visible) ? id(all_profile_names)[start + 1] : blank;
          id(slot_desc_1) = (1 < visible) ? id(all_profile_descs)[start + 1] : blank;
          id(slot_name_2) = (2 < visible) ? id(all_profile_names)[start + 2] : blank;
          id(slot_desc_2) = (2 < visible) ? id(all_profile_descs)[start + 2] : blank;
          id(slot_name_3) = (3 < visible) ? id(all_profile_names)[start + 3] : blank;
          id(slot_desc_3) = (3 < visible) ? id(all_profile_descs)[start + 3] : blank;
          id(slot_name_4) = (4 < visible) ? id(all_profile_names)[start + 4] : blank;
          id(slot_desc_4) = (4 < visible) ? id(all_profile_descs)[start + 4] : blank;
          id(slot_name_5) = (5 < visible) ? id(all_profile_names)[start + 5] : blank;
          id(slot_desc_5) = (5 < visible) ? id(all_profile_descs)[start + 5] : blank;
          id(slot_name_6) = (6 < visible) ? id(all_profile_names)[start + 6] : blank;
          id(slot_desc_6) = (6 < visible) ? id(all_profile_descs)[start + 6] : blank;
          id(slot_name_7) = (7 < visible) ? id(all_profile_names)[start + 7] : blank;
          id(slot_desc_7) = (7 < visible) ? id(all_profile_descs)[start + 7] : blank;
          id(slot_name_8) = (8 < visible) ? id(all_profile_names)[start + 8] : blank;
          id(slot_desc_8) = (8 < visible) ? id(all_profile_descs)[start + 8] : blank;
      # Push the just-computed slice into the 9 static widgets:
      # text/sub-text always, hidden only for slots beyond this page's
      # visible count (which the geometry lambdas in relayout_grid
      # already positioned correctly for the current grid_rows/
      # grid_cols, whether or not they end up hidden here).
      - lvgl.label.update:
          id: slot0_label
          text: !lambda "return id(slot_name_0);"
      - lvgl.label.update:
          id: slot0_sub_label
          text: !lambda "return id(slot_desc_0);"
      - lvgl.widget.update:
          id: slot0_btn
          hidden: !lambda "return 0 >= id(page_visible_count);"
      - lvgl.label.update:
          id: slot1_label
          text: !lambda "return id(slot_name_1);"
      - lvgl.label.update:
          id: slot1_sub_label
          text: !lambda "return id(slot_desc_1);"
      - lvgl.widget.update:
          id: slot1_btn
          hidden: !lambda "return 1 >= id(page_visible_count);"
      - lvgl.label.update:
          id: slot2_label
          text: !lambda "return id(slot_name_2);"
      - lvgl.label.update:
          id: slot2_sub_label
          text: !lambda "return id(slot_desc_2);"
      - lvgl.widget.update:
          id: slot2_btn
          hidden: !lambda "return 2 >= id(page_visible_count);"
      - lvgl.label.update:
          id: slot3_label
          text: !lambda "return id(slot_name_3);"
      - lvgl.label.update:
          id: slot3_sub_label
          text: !lambda "return id(slot_desc_3);"
      - lvgl.widget.update:
          id: slot3_btn
          hidden: !lambda "return 3 >= id(page_visible_count);"
      - lvgl.label.update:
          id: slot4_label
          text: !lambda "return id(slot_name_4);"
      - lvgl.label.update:
          id: slot4_sub_label
          text: !lambda "return id(slot_desc_4);"
      - lvgl.widget.update:
          id: slot4_btn
          hidden: !lambda "return 4 >= id(page_visible_count);"
      - lvgl.label.update:
          id: slot5_label
          text: !lambda "return id(slot_name_5);"
      - lvgl.label.update:
          id: slot5_sub_label
          text: !lambda "return id(slot_desc_5);"
      - lvgl.widget.update:
          id: slot5_btn
          hidden: !lambda "return 5 >= id(page_visible_count);"
      - lvgl.label.update:
          id: slot6_label
          text: !lambda "return id(slot_name_6);"
      - lvgl.label.update:
          id: slot6_sub_label
          text: !lambda "return id(slot_desc_6);"
      - lvgl.widget.update:
          id: slot6_btn
          hidden: !lambda "return 6 >= id(page_visible_count);"
      - lvgl.label.update:
          id: slot7_label
          text: !lambda "return id(slot_name_7);"
      - lvgl.label.update:
          id: slot7_sub_label
          text: !lambda "return id(slot_desc_7);"
      - lvgl.widget.update:
          id: slot7_btn
          hidden: !lambda "return 7 >= id(page_visible_count);"
      - lvgl.label.update:
          id: slot8_label
          text: !lambda "return id(slot_name_8);"
      - lvgl.label.update:
          id: slot8_sub_label
          text: !lambda "return id(slot_desc_8);"
      - lvgl.widget.update:
          id: slot8_btn
          hidden: !lambda "return 8 >= id(page_visible_count);"
      # Paging buttons (B2): disabled, not hidden, at either boundary —
      # a single-page profile list (today's live bridge: exactly one
      # profile) simply keeps both permanently disabled.
      - lvgl.widget.update:
          id: prev_page_btn
          state:
            disabled: !lambda "return id(page_offset) <= 0;"
      - lvgl.widget.update:
          id: next_page_btn
          state:
            disabled: !lambda |-
              int rows = id(grid_rows);
              int cols = id(grid_cols);
              if (rows < 1) rows = 1;
              if (rows > 3) rows = 3;
              if (cols < 1) cols = 1;
              if (cols > 3) cols = 3;
              int page_size = rows * cols;
              return (id(page_offset) + 1) * page_size >= id(total_profile_count);

  - id: do_scan
    mode: single
    then:
      # Defense in depth: the button slots are only unhidden once
      # refresh_profiles/render_page have populated them, which itself
      # requires both bridge values to be non-empty — so this path
      # should be unreachable via the touchscreen. Still checked here
      # directly (not just relying on button visibility) in case a
      # stale page from a previous configuration is ever tapped
      # mid-reconfiguration.
      - if:
          condition:
            lambda: "return id(bridge_url).state.empty() || id(bridge_token).state.empty();"
          then:
            - lvgl.label.update: { id: status_label, text: "Bridge not configured" }
            - delay: 2s
            - lvgl.label.update: { id: status_label, text: "idle" }
          else:
            - lambda: "id(scan_in_progress) = true;"
            - lvgl.widget.update: { id: slot0_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot1_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot2_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot3_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot4_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot5_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot6_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot7_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: slot8_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: prev_page_btn, state: { disabled: true } }
            - lvgl.widget.update: { id: next_page_btn, state: { disabled: true } }
            - light.turn_on:
                id: status_led
                red: 100%
                green: 65%
                blue: 0%
            - lvgl.label.update:
                id: status_label
                text: !lambda 'return std::string("Scanning: ") + id(selected_profile) + "...";'
            - lvgl.widget.update: { id: scan_spinner, hidden: false }
            - lambda: |-
                id(scan_url) = id(bridge_url).state + "/scan";
                id(scan_auth) = std::string("Bearer ") + id(bridge_token).state;
            - http_request.post:
                url: !lambda 'return id(scan_url).c_str();'
                request_headers:
                  Authorization: !lambda 'return id(scan_auth).c_str();'
                json:
                  profile: !lambda "return id(selected_profile);"
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        id(scan_http_status) = response->status_code;
                        id(scan_error_code) = "";
                        if (response->status_code != 200) {
                          json::parse_json(body, [](JsonObject root) -> bool {
                            if (root["error"].is<const char *>()) {
                              id(scan_error_code) = root["error"].as<std::string>();
                            }
                            return true;
                          });
                        }
                    # Every branch below resets the LED and status label
                    # back to idle after a delay — not just the 200
                    # branch (was Review-Fund PR #31: only success used
                    # to reset; error/timeout states stayed on-screen
                    # forever until the next scan attempt). Errors get
                    # a longer delay (4s) than success (2s, unchanged)
                    # so there is time to actually read the message.
                    - if:
                        condition:
                          lambda: "return id(scan_http_status) == 200;"
                        then:
                          - light.turn_on: { id: status_led, red: 0%, green: 100%, blue: 0% }
                          - lvgl.label.update:
                              id: status_label
                              text: !lambda 'return std::string("Done: ") + id(selected_profile);'
                          - delay: 2s
                          - light.turn_off: status_led
                          - lvgl.label.update: { id: status_label, text: "idle" }
                    - if:
                        condition:
                          lambda: "return id(scan_http_status) == 422;"
                        then:
                          - light.turn_on: { id: status_led, red: 100%, green: 40%, blue: 0% }
                          - lvgl.label.update: { id: status_label, text: "No paper in feeder" }
                          - delay: 4s
                          - light.turn_off: status_led
                          - lvgl.label.update: { id: status_label, text: "idle" }
                    - if:
                        condition:
                          lambda: "return id(scan_http_status) == 401 || id(scan_http_status) == 403;"
                        then:
                          - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0% }
                          - lvgl.label.update: { id: status_label, text: "Unauthorized — check Bridge Token" }
                          - delay: 4s
                          - light.turn_off: status_led
                          - lvgl.label.update: { id: status_label, text: "idle" }
                    - if:
                        condition:
                          lambda: "return id(scan_http_status) == 404;"
                        then:
                          - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0% }
                          - lvgl.label.update: { id: status_label, text: "Unknown profile" }
                          - delay: 4s
                          - light.turn_off: status_led
                          - lvgl.label.update: { id: status_label, text: "idle" }
                    - if:
                        condition:
                          lambda: |-
                            return id(scan_http_status) != 200
                                && id(scan_http_status) != 422
                                && id(scan_http_status) != 401
                                && id(scan_http_status) != 403
                                && id(scan_http_status) != 404;
                        then:
                          - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0% }
                          - lvgl.label.update:
                              id: status_label
                              text: !lambda 'return std::string("Error ") + std::to_string(id(scan_http_status));'
                          - delay: 4s
                          - light.turn_off: status_led
                          - lvgl.label.update: { id: status_label, text: "idle" }
                    - lvgl.widget.update: { id: scan_spinner, hidden: true }
                    - lambda: "id(scan_in_progress) = false;"
                    - lvgl.widget.update: { id: slot0_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot1_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot2_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot3_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot4_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot5_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot6_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot7_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot8_btn, state: { disabled: false } }
                    # Not a blanket `disabled: false` for prev/next like
                    # the 9 slots above — their enabled state also
                    # depends on the page boundary (B2), which a
                    # unconditional re-enable would ignore and could
                    # wrongly re-enable a "next" button already at the
                    # last page. render_page recomputes both correctly
                    # from the unchanged page_offset/total_profile_count
                    # (a scan doesn't change either); the slot text/
                    # hidden state it also touches is unaffected too, so
                    # this is a correctness fix, not just a refresh.
                    - script.execute: render_page
                on_error:
                  then:
                    - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0% }
                    - lvgl.label.update: { id: status_label, text: "Bridge unreachable" }
                    - delay: 4s
                    - light.turn_off: status_led
                    - lvgl.label.update: { id: status_label, text: "idle" }
                    - lvgl.widget.update: { id: scan_spinner, hidden: true }
                    - lambda: "id(scan_in_progress) = false;"
                    - lvgl.widget.update: { id: slot0_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot1_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot2_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot3_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot4_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot5_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot6_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot7_btn, state: { disabled: false } }
                    - lvgl.widget.update: { id: slot8_btn, state: { disabled: false } }
                    # See the comment on the same pattern in on_response
                    # above — prev/next need render_page, not a blanket
                    # disabled: false.
                    - script.execute: render_page

# Polling intervals are a responsiveness decision, not just a freshness
# one. ESPHome's http_request is synchronous: while a poll is in flight
# the main loop is blocked, LVGL processes no input, and a tap landing in
# that window is simply lost. A panel on a slow link showed
#
#   [W][component:473] interval took a long time for an operation
#   (1091 ms), max is 190 ms
#
# so each poll cost over a second of dead touchscreen. At the previous
# 15s/30s the panel was unresponsive several percent of the time, and
# tapping a profile "did nothing" often enough to look broken.
#
# Neither value needs to be that eager. The bridge indicator is a status
# light, not a heartbeat, and profiles change when someone edits a YAML
# file and restarts the daemon — not every half minute.
interval:
  - interval: 300s
    then:
      - script.execute: refresh_profiles
  - interval: 60s
    then:
      - script.execute: check_bridge_health

# ---------------------------------------------------------------------
# UI: fixed landscape 320x240 layout, 9 static button slots (still no
# flex/grid layout engine — geometry is computed via the templatable
# x/y/width/height lambdas below, shared with relayout_grid in script:
# via YAML anchors). Content is filled at runtime by render_page above
# via lvgl.label.update / lvgl.widget.update. Portrait is a later
# option (see README.md).
# ---------------------------------------------------------------------

lvgl:
  displays:
    - cyd_display
  touchscreens:
    - cyd_touch
  # 0 by default (landscape, unchanged) — the portrait override sets 90
  # here via the substitution. `display.rotation` above stays hardcoded
  # at 0 either way: ESPHome's LVGL docs are explicit that rotation
  # belongs here, not on the display, and that this single setting
  # rotates both the rendered content and the touch input together —
  # no separate display- or touchscreen-level rotation needed on top.
  rotation: ${panel_rotation}
  pages:
    - id: main_page
      widgets:
        - obj:
            x: 0
            y: 0
            width: 320
            height: 22
            pad_all: 0
            border_width: 0
            widgets:
              - label:
                  id: title_label
                  x: 4
                  y: 2
                  text: "Scan Profiles"
              - label:
                  id: wifi_status_label
                  x: 130
                  y: 2
                  text: "WiFi: --"
              - label:
                  id: bridge_status_label
                  x: 220
                  y: 2
                  text: "Bridge: --"

        - button:
            id: slot0_btn
            x: *slot0_x
            y: *slot0_y
            width: *slot_col_width
            height: *slot_row_height
            hidden: true
            widgets:
              - label:
                  id: slot0_label
                  align: TOP_MID
                  y: 6
                  text: ""
              - label:
                  id: slot0_sub_label
                  align: BOTTOM_MID
                  y: -6
                  width: 96
                  long_mode: DOT
                  text: ""
            on_press:
              then:
                - if:
                    condition:
                      lambda: "return !id(scan_in_progress);"
                    then:
                      - lambda: "id(selected_profile) = id(slot_name_0);"
                      - script.execute: do_scan

        - button:
            id: slot1_btn
            x: *slot1_x
            y: *slot1_y
            width: *slot_col_width
            height: *slot_row_height
            hidden: true
            widgets:
              - label:
                  id: slot1_label
                  align: TOP_MID
                  y: 6
                  text: ""
              - label:
                  id: slot1_sub_label
                  align: BOTTOM_MID
                  y: -6
                  width: 96
                  long_mode: DOT
                  text: ""
            on_press:
              then:
                - if:
