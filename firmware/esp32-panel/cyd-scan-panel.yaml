# ESPHome firmware for the ESP32-2432S028R ("Cheap Yellow Display" / CYD)
# scan-control panel — Issue #9.
#
# v2 scope: secret-free, runtime configuration. This firmware carries no
# Wi-Fi credentials, bridge URL, or bearer token at build time — it ships
# as one public binary via the browser-based ESP Web Tools installer
# (Issue #9, phase E). Wi-Fi is provisioned in-browser via Improv right
# after flashing; the bridge URL and bearer token are `text` entities
# held in flash (NVS) and set from the panel's own `web_server`
# dashboard afterwards. Grid (1x1 up to 3x3, configurable at runtime via
# the "Grid Rows"/"Grid Cols" `number` entities, default 2x3 = today's
# fixed 6-button layout) populated at runtime from GET /profiles,
# tap-to-scan via POST /scan, with a centered spinner shown for the
# duration of the request (Issue #9 item B5). A three-state top-bar
# indicator (green/red/blue) polls GET /ready instead of the old plain
# GET /health, so it reflects the bridge's actual readiness contract —
# green when profiles are loaded and sane-runtime answers, blue when
# only the scanner backend specifically is down, red for every other
# not-ready/unreachable case (Issue #9 item B6). Profiles beyond one
# page are reachable via the footer's prev/next buttons. Display
# orientation (landscape by default, portrait via a `packages:` override
# — Issue #9 item B4) is a build-time choice, not runtime-configurable.
# See README.md for flashing, the mandatory post-flash touch
# calibration, how to build a portrait variant, and known limitations.
#
# Hardware bring-up values below (pins, SPI buses, display/touch options)
# are cross-verified for the ESP32-2432S028R and must not be changed
# without re-verifying against the board's actual wiring — this is the one
# widely-cloned "CYD" board revision this firmware targets.

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "paperless-scan-bridge CYD scan-control panel (v2, Issue #9, secret-free, ${orientation})"
  min_version: "2024.5.0"
  # The update platform compares the manifest's `version` against this.
  # Without it the panel cannot recognise a build as installed and keeps
  # reporting the same update forever, even straight after applying it.
  # CI overrides `project_version` with the short commit SHA it also
  # writes into the manifest; a local build without that override says
  # "dev", which will never match a published manifest — deliberately,
  # so a hand-built panel is not told it is out of date.
  project:
    name: strausmann.paperless-scan-bridge
    version: "${project_version}"
  on_boot:
    priority: -100
    then:
      # -100 is very late — guaranteed to run after every component's
      # setup(), including LVGL's (which is what actually constructs
      # the 9 button widgets `relayout_grid` below updates). Setting
      # `ui_ready` here, not at compile-time, is what makes it safe for
      # `grid_rows_cfg`/`grid_cols_cfg` to call `relayout_grid` from
      # their own `on_value` — including the one `on_value` fires
      # during their own setup() while restoring a persisted value,
      # which can run before or after LVGL's setup() depending on
      # component setup-priority ordering. `relayout_grid` checks
      # `ui_ready` first and no-ops otherwise, so that early call can
      # never touch a not-yet-created widget.
      - lambda: "id(ui_ready) = true;"
      - script.execute: relayout_grid
      # NOT refresh_profiles / check_bridge_health here any more.
      #
      # on_boot at priority -100 runs after every component's setup(),
      # but Wi-Fi association happens asynchronously in the main loop
      # afterwards -- so at this point there is no network. Both
      # requests therefore failed at the network layer on every boot,
      # and the only thing that tried again was the 300s interval:
      # measured on the device, boot at 19:46:30, profiles at 19:51:30,
      # exactly 300 seconds later, with an empty grid in between.
      #
      # wifi.on_connect below is where they belong. It also fires again
      # after a reconnect, which is the other moment the panel's view of
      # the bridge is stale.

esp32:
  board: esp32dev
  # ESPHome's own option, not a raw sdkconfig override: it writes
  # CONFIG_ESP_TASK_WDT_TIMEOUT_S itself (esp32/__init__.py), so setting
  # both would be two writers for one key with no defined winner.
  # CONFIG_ESP_TASK_WDT_PANIC is True alongside it, which is why hitting
  # the limit reboots rather than merely logging.
  watchdog_timeout: 60s
  framework:
    type: arduino
    # The task watchdog defaults to 5s and the scan POST blocks the
    # main loop for the whole scan -- twenty seconds on the reference
    # hardware. Every scan started from the panel therefore paniced the
    # device at the five-second mark and rebooted it, which from the
    # front looks like "the panel crashed while the scanner kept
    # going": the bridge already had the request, so the scan completed
    # and the panel that asked for it was gone.
    #
    # 60s is chosen against the scan, not against the watchdog: the
    # reference duplex scan takes about twenty seconds and the profile
    # allows up to 120, so this covers the normal case with room and
    # still fires long before a genuinely wedged device sits there
    # forever.
    #
    # This raises the ceiling; it does not make blocking the loop
    # correct. The real fix is not to block it at all -- the bridge's
    # /jobs endpoints (Phase 1.4) would let the panel fire a scan and
    # poll for the result instead of holding the loop through it. Until
    # those exist, ESPHome's http_request is synchronous and there is
    # no async path to use.

substitutions:
  name: cyd-scan-panel
  friendly_name: "Scan Panel"
  # Overridden by CI with the short commit SHA so it matches the
  # manifest's `version` — see esphome.project above.
  project_version: "dev"
  # Display orientation (Issue #9 item B4). `orientation` is informational
  # only (surfaced in `esphome.comment` above so the merged config
  # documents which build this is); the eight substitutions below are the
  # ones that actually drive it — `display.dimensions.*`, `lvgl.rotation`
  # and `touchscreen.calibration.*`/`transform.swap_xy` all read from
  # them. Defaults below reproduce today's landscape build byte-for-byte:
  # `display.dimensions`/`lvgl.rotation` in the merged `esphome config`
  # output are unchanged from before these substitutions existed. A
  # portrait build overrides all nine via a `packages:` include wrapper —
  # see README.md "Display orientation" for the exact wrapper and why
  # `display.rotation` (further below) stays hardcoded at 0 either way
  # (ESPHome rejects a non-zero value there once `lvgl:` is in the
  # config — rotation belongs in `lvgl.rotation` instead).
  orientation: landscape
  screen_width: "320"
  screen_height: "240"
  panel_rotation: "0"
  touch_swap_xy: "true"
  # Measured on the reference unit, all four corners:
  #
  #   top-left     [3820, 3820]      top-right    [3750,  216]
  #   bottom-left  [ 290, 3777]      bottom-right [ 388,  309]
  #
  # Those readings settle three things that were previously assumed:
  #
  #   * raw_x tracks the screen's VERTICAL axis (high at the top) and
  #     raw_y the HORIZONTAL one (high at the left) — so `swap_xy: true`
  #     is correct. A single corner could not show this, because
  #     top-left sits on the diagonal where both raw axes read alike.
  #   * Both axes are inverted, hence both mirrors. Unmirrored, a tap on
  #     the top-left corner mapped to (316, 237) — diagonally opposite
  #     the finger — so every press on a profile button landed on empty
  #     screen and did nothing.
  #   * The endpoints below are the per-edge MEANS of those readings,
  #     not their extremes -- each edge is read twice (the left edge by
  #     the top-left and bottom-left taps, and so on) and the two never
  #     agree: 216 vs 309, 3820 vs 3777. Averaging splits that error
  #     instead of loading it all onto one corner. So x_min is
  #     (216+309)/2 and x_max (3820+3777)/2 -- from raw_y, because
  #     swap_xy means the x bounds come from the raw axis that carries
  #     the horizontal. With them the corners map to (0,0), (320,2),
  #     (2,240) and (316,237); the first two are a pixel or so outside
  #     the screen before clamping, which is the expected cost of
  #     averaging.
  #
  # Still per-unit: resistive panels vary, so re-measure for a new board.
  # README.md "Touch calibration" has the procedure.
  touch_x_min: "262"
  touch_x_max: "3798"
  touch_y_min: "339"
  touch_y_max: "3785"
  # Both axes read inverted on the reference unit, so both are mirrored
  # below. ESPHome refuses a descending calibration range ("x_min must
  # be smaller than x_max. To mirror the direction use the 'transform'
  # options"), which is why this is a transform and not swapped bounds.
  touch_mirror_x: "true"
  touch_mirror_y: "true"

logger:
  baud_rate: 115200
  # The default log is dominated by two components that say nothing
  # about what the panel is doing. `xpt2046` prints a line per touch
  # sample (several per second while a finger rests on the glass) and
  # `http_request.idf` prints one per received response header, so a
  # single poll costs two lines that carry only "content-length: 19".
  # Between them they bury every line that identifies an action, its
  # data or its outcome. Both are raised to INFO -- still reachable by
  # lowering this if the touch driver itself is ever under suspicion.
  #
  # `component` deliberately stays: its "took a long time" warnings are
  # how a blocked loop announces itself, and this firmware blocks the
  # loop on every HTTP call.
  level: DEBUG
  logs:
    xpt2046: INFO
    http_request.idf: INFO
  # Response bodies are logged below (truncated to 200 characters). The
  # default 512-byte line buffer would clip those lines mid-JSON.
  tx_buffer_size: 1024

# No `api:` block. This build carries no fixed native-API encryption key
# (a public binary cannot embed a per-device secret), and the panel does
# not need Home Assistant discovery — it is purely an HTTP client of the
# scan-bridge (see README.md "Security model"). `web_server:` below does
# not require `api:` to be present.

# OTA with no fixed password: a public binary cannot ship a shared
# secret either, and per-device OTA passwords are out of scope for v2
# (no on-device way to set one before the first flash). OTA is therefore
# LAN-trust, same posture as the plain-HTTP bridge token below — see
# README.md "Security model". Re-flashing over USB via the same
# installer page is always available regardless.
ota:
  # Push OTA: the ESPHome dashboard, or a hand-picked .bin uploaded
  # through web_server's own form. Kept as the recovery path — it works
  # without the panel being able to reach the internet.
  - platform: esphome
  # Pull OTA: downloads the image the update entity below points at and
  # verifies its MD5 while writing. A mismatch discards the download and
  # leaves the running firmware untouched, so a truncated or tampered
  # transfer cannot brick the panel (ADR 0023).
  - platform: http_request

# Self-update (ADR 0023). Polls the same manifest.json the browser
# installer uses — one file, two consumers: ESP Web Tools reads `parts`
# for the USB install, this reads the `ota` block.
#
# This entity only *reports* that an update exists. Installing stays a
# deliberate action from the dashboard; nothing here installs on its own.
# That is the constraint that makes the missing TLS verification
# acceptable: the exposure window is the moment an operator chooses to
# update, not every six hours indefinitely. See ADR 0023 for why
# `verify_ssl` cannot be enabled on this framework, and why the MD5 —
# not TLS — is the integrity guarantee.
#
# The URL is a GitHub Pages one on purpose. ESPHome's docs warn that
# GitHub *release* URLs redirect to long URLs that overflow the HTTP
# client's response buffer; Pages URLs do not redirect.
update:
  - platform: http_request
    name: "Firmware Update"
    id: firmware_update
    source: https://scan-bridge.strausmann.de/firmware/manifest.json
    update_interval: 6h

wifi:
  # No `ssid:`/`password:` here on purpose — this is the whole point of
  # "secret-free": Wi-Fi station credentials are never build-time values.
  # `esp32_improv`/`improv_serial` below provision them into NVS after
  # flashing (ESP Web Tools drives this in the browser); `ap:` is the
  # fallback hotspot for as long as no station network is configured yet
  # (or the last-known one is unreachable). WPA2 needs >= 8 chars; this
  # password is the same on every unit by construction (it is baked into
  # a public binary) and only protects the temporary setup-mode hotspot,
  # not the bridge or the panel's own dashboard — see README.md
  # "Security model".
  ap:
    ssid: "${friendly_name} Setup"
    password: "panelsetup"
  on_connect:
    - lvgl.label.update:
        id: wifi_status_label
        text: "WiFi: OK"
    # Fetch profiles and the bridge state the moment there IS a network
    # -- not at on_boot, which runs before Wi-Fi associates (see the
    # note there), and not five minutes later when the interval next
    # comes round. Fires on a reconnect too: a panel that dropped off
    # the network comes back with a stale grid otherwise.
    - script.execute: refresh_profiles
    - script.execute: check_bridge_health
  on_disconnect:
    - lvgl.label.update:
        id: wifi_status_label
        text: "WiFi: --"

captive_portal:

# First-boot provisioning: Improv over BLE and/or the same USB-serial
# connection used for flashing, so ESP Web Tools can flash + provision
# Wi-Fi in one browser flow. authorizer: none — this panel has no
# physical confirmation button; anyone with local BLE/serial access
# during first boot can provision it. Acceptable for a LAN-only panel
# (see README.md "Security model").
esp32_improv:
  authorizer: none

improv_serial:

# Runtime dashboard: lets the bridge URL / bearer token `text` entities
# below (and Wi-Fi re-provisioning) be set from a browser pointed at the
# panel's own IP, no re-flash needed. `local: true` bundles the
# dashboard's JS/CSS in the firmware image itself instead of fetching
# them from esphome.io at runtime — consistent with this project's "no
# cloud dependencies for core functionality" principle (CLAUDE.md): the
# panel's own config UI must work from a browser with no other internet
# access than the LAN it shares with the panel.
web_server:
  version: 3
  local: true

http_request:
  id: http
  useragent: "esphome/cyd-scan-panel"
  # 8s was shorter than a scan. A duplex page through this feeder takes
  # about twenty seconds, so POST /scan could never return in time --
  # the panel timed out on every scan it ever started, and would have
  # reported "Bridge unreachable" for a scan that was working, if it
  # had survived long enough to report anything (see the watchdog note
  # in esp32: above).
  #
  # 120s matches the profile's own timeout_seconds, which bounds the
  # whole /scan call on the bridge side. Any answer the bridge can give
  # arrives before this fires; anything slower has already failed
  # there.
  timeout: 120s
  # Plain HTTP is intentional (LAN-only deployment) — see README.md
  # "Security model". If the bridge ever moves behind a TLS-terminating
  # proxy, set the Bridge URL text entity to https://... and remove this
  # (or point verify_ssl at a real CA).
  verify_ssl: false
  # The update manifest is ~490 bytes and the default response buffer is
  # 512. That is 20 bytes of headroom — one longer summary string and
  # the update check fails silently, with the panel simply never
  # noticing a new build. Raised with room to grow (ADR 0023).
  buffer_size_rx: 2048

json:

# ---------------------------------------------------------------------
# Crash diagnostics.
#
# The operator reports the panel "crashing" under heavy tapping and
# dragging: the profile buttons vanish, the Wi-Fi and Bridge indicators
# both go bad, and everything repairs itself a few seconds later. That
# is precisely the panel's own boot sequence seen from the outside --
# `on_boot` re-runs `refresh_profiles` and `check_bridge_health`, and
# the grid is empty until the first answers arrive -- so a reboot is the
# obvious reading. Obvious is not verified, and the plausible causes
# want opposite fixes:
#
#   - a task/interrupt watchdog (the loop was held too long),
#   - a panic from a bad memory access,
#   - a brownout, which on a CYD fed from a weak USB supply is a real
#     possibility the moment Wi-Fi transmits,
#   - or no reset at all, and the UI merely repaints wrongly.
#
# `reset_reason` tells these apart in one reading, so it is measured
# rather than guessed. `uptime` proves whether a reset happened at all;
# `loop_time` shows how long the loop is actually held (the watchdog
# case); the heap sensors show exhaustion or fragmentation (the panic
# case). All of it lands on the panel's own dashboard, so whoever is
# holding the panel can read it without a cable or a toolchain.
#
# Kept after diagnosis: these are ESPHome's standard diagnostics and
# cost a few hundred bytes of flash. The next unexplained restart should
# not need this commit written a second time.
# ---------------------------------------------------------------------
debug:
  update_interval: 30s

sensor:
  - platform: uptime
    name: "Uptime"
    id: panel_uptime
    update_interval: 30s
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Largest Block"
    fragmentation:
      name: "Heap Fragmentation"
    loop_time:
      name: "Loop Time"

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"


# ---------------------------------------------------------------------
# Runtime configuration. Replaces the v1 build-time `substitutions:` /
# `!secret` values for the bridge connection. Both entities persist to
# flash (`restore_value: true`) and are editable from the `web_server`
# dashboard above at the panel's IP — no re-flash needed to change
# either. Neither entity has an `initial_value`: both start empty on a
# freshly flashed, never-configured panel, which is exactly the state
# the guards in the scripts below check for (`state.empty()` ->
# "Bridge: not set"). Set both from the dashboard after flashing.
# ---------------------------------------------------------------------

text:
  - platform: template
    name: "Bridge URL"
    id: bridge_url
    optimistic: true
    restore_value: true
    mode: text
    # A freshly flashed panel boots with both values empty, so on_boot
    # skips refresh_profiles and check_bridge_health. Without this,
    # filling them in from the dashboard changed nothing visible: the
    # grid stayed empty and the bridge indicator stayed grey until the
    # next 300s poll or a reboot, which reads as "I configured it and
    # it does not work".
    on_value:
      - script.execute: refresh_profiles
      - script.execute: check_bridge_health
  - platform: template
    name: "Bridge Token"
    id: bridge_token
    optimistic: true
    restore_value: true
    mode: password
    # Same reason as Bridge URL above. Both are needed before a scan can
    # be triggered, and either one arriving last is the one that
    # completes the configuration — so both re-check.
    on_value:
      - script.execute: refresh_profiles
      - script.execute: check_bridge_health

# ---------------------------------------------------------------------
# Grid size (Issue #9 item B1). Two persistent `number` entities, same
# runtime-configurable idiom as the `text` entities above (restore_value
# true, editable from the same `web_server` dashboard, no re-flash
# needed). `initial_value: 2` / `initial_value: 3` reproduce today's
# fixed 2x3 = 6-slot layout byte-for-byte on a freshly flashed panel —
# see `globals: grid_rows`/`grid_cols` below, which mirror these at
# `on_boot` and stay the actual source of truth the LVGL widget geometry
# lambdas read (decoupled from `number` restore timing on purpose: a
# plain `int` global with a compile-time `initial_value` is guaranteed
# ready before LVGL builds its widgets; whether `number.template`'s
# `restore_value` has already run its NVS read by that point in
# `setup()` is not something this firmware wants to depend on). Range
# 1..3 each — 3x3 is the largest grid the 9 static button slots below
# support; see `relayout_grid`/`render_page` in `script:`.
number:
  - platform: template
    name: "Grid Rows"
    id: grid_rows_cfg
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 1
    max_value: 3
    step: 1
    on_value:
      then:
        - lambda: "id(grid_rows) = (int) x;"
        - script.execute: relayout_grid
  - platform: template
    name: "Grid Cols"
    id: grid_cols_cfg
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 1
    max_value: 3
    step: 1
    on_value:
      then:
        - lambda: "id(grid_cols) = (int) x;"
        - script.execute: relayout_grid

# ---------------------------------------------------------------------
# Board bring-up: two independent SPI buses (mandatory on the CYD — the
# display and the touch controller are NOT on a shared bus), the
# ILI9341 display, the XPT2046 touch controller, the GPIO21 backlight,
# and the active-low RGB status LED.
# ---------------------------------------------------------------------

spi:
  - id: tft_spi
    clk_pin: 14
    mosi_pin: 13
    miso_pin:
      number: 12
      # GPIO12 is an ESP32 strapping pin (flash voltage select). The CYD
      # wires it to the display's MISO regardless; this only silences
      # ESPHome's strapping-pin warning, it does not change behavior.
      ignore_strapping_warning: true
  - id: touch_spi
    clk_pin: 25
    mosi_pin: 32
    miso_pin: 39

display:
  - platform: ili9xxx
    id: cyd_display
    model: ILI9341
    spi_id: tft_spi
    cs_pin:
      number: 15
      # GPIO15 is an ESP32 strapping pin (MTDO). Same rationale as
      # GPIO12 above.
      ignore_strapping_warning: true
    dc_pin:
      number: 2
      # GPIO2 is also an ESP32 strapping pin. Confirmed by
      # `esphome config` (WARNING GPIO2 is a strapping PIN...) against
      # this exact config — not present in the source brief, added here
      # after seeing the real warning.
      ignore_strapping_warning: true
    invert_colors: false
    # No PSRAM on the WROOM-32 module used by the CYD — a 16-bit
    # framebuffer does not fit. 8BIT is the palette mode that does.
    color_palette: 8BIT
    # LVGL owns rendering; a periodic full-screen redraw would fight it.
    auto_clear_enabled: false
    update_interval: never
    # Stays hardcoded at 0 regardless of orientation — see the
    # `substitutions:` comment above. ESPHome's validator rejects a
    # non-zero value here once `lvgl:` is configured ("set rotation in
    # the LVGL config instead"); `lvgl.rotation` below is where the
    # portrait override actually rotates the panel.
    rotation: 0
    dimensions:
      # ESPHome's ili9xxx docs: "the dimensions are those of the final
      # display" — i.e. these must already be the ROTATED (post-`lvgl.
      # rotation`) width/height, not the panel's physical/native ones.
      # For the 90°-portrait override this means 240x320 (swapped), kept
      # in lockstep with `lvgl.rotation` via the substitutions above so
      # the two can never drift apart independently.
      width: ${screen_width}
      height: ${screen_height}

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: touch_spi
    cs_pin: 33
    interrupt_pin: 36
    threshold: 400
    # Placeholder calibration — every panel is different out of the
    # factory. MUST be re-calibrated per physical unit after first
    # flash; see README.md "Touch calibration". Read from the
    # substitutions above so a portrait override (Issue #9 item B4) can
    # ship its own placeholder starting point — still just a starting
    # point, recalibration is mandatory in either orientation.
    calibration:
      x_min: ${touch_x_min}
      x_max: ${touch_x_max}
      y_min: ${touch_y_min}
      y_max: ${touch_y_max}
    transform:
      swap_xy: ${touch_swap_xy}
      mirror_x: ${touch_mirror_x}
      mirror_y: ${touch_mirror_y}

output:
  # Backlight: GPIO21, active-HIGH. Wrapped in a monochromatic light
  # with restore_mode ALWAYS_ON below — without that the screen is
  # black after every reboot (light components default to OFF).
  - platform: ledc
    id: backlight_pwm_output
    pin: 21
  # RGB status LED, active-LOW (CYD wiring) — each channel inverted.
  - platform: ledc
    id: led_red_output
    pin:
      number: 4
      inverted: true
  - platform: ledc
    id: led_green_output
    pin:
      number: 16
      inverted: true
  - platform: ledc
    id: led_blue_output
    pin:
      number: 17
      inverted: true

light:
  - platform: monochromatic
    id: panel_backlight
    name: "Panel Backlight"
    output: backlight_pwm_output
    restore_mode: ALWAYS_ON
  - platform: rgb
    id: status_led
    name: "Panel Status LED"
    red: led_red_output
    green: led_green_output
    blue: led_blue_output
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------
# Runtime state. Kept as plain globals ("the firmware stays dumb", per
# the API design in Issue #9) — no client-side sorting/filtering, the
# bridge already returns profiles in the order to display.
#
# Grid size (B1) and paging (B2): `grid_rows`/`grid_cols` are the source
# of truth the 9 static LVGL button slots' x/y/width/height lambdas
# read — a plain `int` global with a compile-time `initial_value` (not
# the `grid_rows_cfg`/`grid_cols_cfg` `number` entities' `.state`
# directly), so widget geometry never depends on whether `number`'s
# `restore_value` has already run by the time LVGL builds its widgets.
# `all_profile_names`/`all_profile_descs` hold every profile the bridge
# returned (capped defensively, see `refresh_profiles`); the 9
# `slot_name_N`/`slot_desc_N` globals below hold only the current page's
# slice, filled by `render_page`. `ui_ready` guards `relayout_grid`
# against running before LVGL has actually constructed the 9 button
# widgets — see the `on_boot` comment.
#
# `screen_width`/`screen_height` (Issue #9 item B4) are this same
# compile-time-`initial_value`-global idiom applied to the grid geometry
# lambdas in `relayout_grid` below, which until now read the display's
# 320x240 landscape dimensions as two hardcoded literals. Reading them
# from globals instead — mirroring `grid_rows`/`grid_cols` above, sourced
# from the `screen_width`/`screen_height` substitutions rather than a
# `number` entity's `.state` — keeps the grid's column/row math correct
# for whatever `display.dimensions` the current build was compiled with,
# landscape or the portrait override, with no separate flag to keep in
# sync.
# ---------------------------------------------------------------------

globals:
  # Set immediately before each outgoing request; the on_response /
  # on_error lambda subtracts it to report duration_ms. One global is
  # enough because http_request is synchronous -- two requests can
  # never be in flight at once.
  - id: request_started_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: ui_ready
