    mode: restart
    then:
      # See `ui_ready` in `globals:` — without this guard, a `number`
      # entity restoring a persisted grid size during its own setup()
      # could call this before LVGL has actually created the 9 button
      # widgets below, touching a not-yet-existing widget.
      - if:
          condition:
            lambda: "return id(ui_ready);"
          then:
            - lvgl.widget.update:
                id: slot0_btn
                x: &slot0_x !lambda |-
                    int cols = id(grid_cols);
                    if (cols < 1) cols = 1;
                    int gap = 4;
                    int col_w = (id(screen_width) - (cols - 1) * gap) / cols;
                    int col = 0 % cols;
