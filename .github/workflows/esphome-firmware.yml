# Build the CYD scan-control panel firmware (Issue #9, phase E) and
# produce an ESP Web Tools manifest.json so it can be flashed straight
# from a browser. This only works because the firmware is secret-free
# (see firmware/esp32-panel/README.md "Secret-free firmware") — a
# public CI artifact cannot carry Wi-Fi credentials, a bridge URL, or a
# bearer token.
#
# This workflow is both standalone (its own push/workflow_dispatch
# triggers, for an ad-hoc build+artifact without touching docs) and
# reusable (`workflow_call`) — the Docs workflow (docs.yml) calls it as
# a job so every Pages deploy carries a firmware build from the same
# commit, without standing up a second Pages deployment. See docs.yml
# for how the `esp32-firmware` artifact this job uploads gets copied
# into site/firmware/ before the Pages upload.

name: ESPHome firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/esp32-panel/**'
      - '.github/workflows/esphome-firmware.yml'
  workflow_dispatch:
  # No standalone `pull_request:` trigger here — docs.yml already has
  # `firmware/esp32-panel/**` in its own pull_request paths and calls
  # this workflow as a job, so a firmware-touching PR would otherwise
  # compile twice (once here, once via the reusable call).
  workflow_call:
    inputs:
      version:
        description: >-
          Version string for the manifest and the compiled binary.
          Defaults to the short commit SHA, which is right for a main
          build. A release run passes its tag instead, so the firmware
          attached to a GitHub Release identifies itself by that tag
          rather than by a SHA nobody can map back to a release.
        required: false
        type: string
        default: ''
    outputs:
      artifact-name:
        description: 'Name of the uploaded firmware + manifest.json artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

env:
  ESPHOME_VERSION: '2026.7.4'
  FIRMWARE_NAME: cyd-scan-panel
  ARTIFACT_NAME: esp32-firmware

permissions:
  contents: read

concurrency:
  # The version input is part of the key, not just the ref. During a
  # release github.ref is refs/heads/main -- the same value docs.yml
  # produces when it calls this workflow on a push to main -- so with
  # cancel-in-progress the two would cancel each other, and the release
  # firmware build is the one that must not be lost. A release call
  # passes its tag, so it lands in its own group.
  group: esphome-firmware-${{ github.ref }}-${{ inputs.version || 'branch' }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile + manifest
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ env.ARTIFACT_NAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install "esphome==${{ env.ESPHOME_VERSION }}"

      # project_version must equal the manifest's `version`, or the panel
      # can never recognise a build as installed and keeps offering the
      # update it just applied. Both are the short SHA; the substitution
      # is overridden here rather than committed so a local build stays
      # "dev" and is never told it is out of date.
      - name: Compile firmware
        working-directory: firmware/esp32-panel
        env:
          ESPHOME_PROJECT_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${{ inputs.version || '' }}"
          # The short SHA stays the default: it is what a main build
          # should report, and it is what the published site serves.
          [ -n "$version" ] || version="${GITHUB_SHA:0:7}"
          esphome -s project_version "$version" compile "${{ env.FIRMWARE_NAME }}.yaml"

      # esphome's ESP-IDF-based build (the current default for esp32 +
      # arduino framework) writes the merged, flash-ready factory image
      # somewhere under .esphome/build/<name>/ — the exact subpath has
      # moved between ESPHome releases (older PlatformIO-only builds
      # used .pioenvs/<name>/), so this locates it by name instead of
      # hardcoding a path that the next ESPHome upgrade could silently
      # break.
      # Two different binaries, for two different install paths:
      #   *.factory.bin — the full flash image including bootloader and
      #     partition table. This is what ESP Web Tools writes over USB
      #     at offset 0 to a blank or unknown chip.
      #   firmware.bin  — the application image alone. This is what OTA
      #     installs into the inactive slot of an already-flashed panel;
      #     writing the factory image over OTA would be wrong and much
      #     larger.
      # The exact subpath has moved between ESPHome releases, so both are
      # located by name rather than by a hardcoded path.
      - name: Locate firmware images
        id: locate
        working-directory: firmware/esp32-panel
        run: |
          set -euo pipefail
          build_dir=".esphome/build/${{ env.FIRMWARE_NAME }}"

          # Both images are named explicitly by ESPHome. Verified
          # against a real 2026.7.4 build, whose tree also contains
          # bootloader.bin, partition-table.bin, ota_data_initial.bin
          # and CMake's compiler-probe binaries — a glob would happily
          # return one of those.
          factory="$(find "$build_dir" -name 'firmware.factory.bin' -print -quit)"
          if [ -z "$factory" ]; then
            echo "::error::no firmware.factory.bin found under $build_dir"
            find "$build_dir" -maxdepth 6 -name '*.bin' || true
            exit 1
          fi

          # ESPHome writes the OTA image as firmware.ota.bin. Selecting
          # it by name matters more than it looks: the previous
          # "any .bin that is not the factory image" would have taken
          # whatever `find -print -quit` reached first, and the real
          # build tree contains bootloader.bin, partition-table.bin,
          # ota_data_initial.bin and two CMakeDetermineCompilerABI_*.bin
          # probes. The md5 guard below could not have caught it — it
          # hashes whatever was selected, so a compiler probe would have
          # been published with a perfectly matching checksum and the
          # panel would have tried to install it.
          ota="$(find "$build_dir" -name 'firmware.ota.bin' -print -quit)"
          if [ -z "$ota" ]; then
            echo "::error::no firmware.ota.bin found under $build_dir"
            find "$build_dir" -maxdepth 6 -name '*.bin' || true
            exit 1
          fi

          echo "Factory: $factory"
          echo "OTA:     $ota"
          echo "image=$factory" >> "$GITHUB_OUTPUT"
          echo "ota_image=$ota" >> "$GITHUB_OUTPUT"

      # One manifest serves both paths (ADR 0023): ESP Web Tools reads
      # `parts` for the USB install, ESPHome's update platform reads the
      # `ota` block for self-update. The md5 there is not decoration —
      # the device compares it against what it actually wrote and
      # discards a mismatch, so a stale or wrong hash makes every update
      # fail closed.
      - name: Assemble dist/ (binaries + manifest)
        working-directory: firmware/esp32-panel
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.locate.outputs.image }}" "dist/${{ env.FIRMWARE_NAME }}.factory.bin"
          cp "${{ steps.locate.outputs.ota_image }}" "dist/${{ env.FIRMWARE_NAME }}.ota.bin"

          version="${{ inputs.version || '' }}"
          [ -n "$version" ] || version="${GITHUB_SHA:0:7}"
          ota_md5="$(md5sum "dist/${{ env.FIRMWARE_NAME }}.ota.bin" | cut -d' ' -f1)"

          # A tag build points at its release page; a main build points
          # at the commit. The panel shows this URL next to an available
          # update, so "what am I about to install" has to resolve to
          # something a person can read.
          if [ -n "${{ inputs.version || '' }}" ]; then
            summary="Release ${version}"
            release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${version}"
          else
            summary="Built from ${GITHUB_SHA}"
            release_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          fi

          cat > dist/manifest.json <<EOF
          {
            "name": "CYD Scan Panel",
            "version": "${version}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "${{ env.FIRMWARE_NAME }}.factory.bin", "offset": 0 }
                ],
                "ota": {
                  "md5": "${ota_md5}",
                  "path": "${{ env.FIRMWARE_NAME }}.ota.bin",
                  "summary": "${summary}",
                  "release_url": "${release_url}"
                }
              }
            ]
          }
          EOF
          python3 -m json.tool dist/manifest.json > /dev/null

          # Checksums for anyone who downloads a binary rather than
          # flashing it from the browser. The manifest's MD5 covers the
          # OTA image only, and only for the panel's own verification --
          # it is not a file a person can check a download against.
          (cd dist && sha256sum ./*.bin ./manifest.json > SHA256SUMS)

      # A manifest whose md5 does not describe its own binary fails every
      # update on the device, silently and forever. Cheaper to catch here.
      - name: Verify the manifest describes the shipped OTA image
        working-directory: firmware/esp32-panel
        run: |
          set -euo pipefail
          declared="$(python3 -c 'import json;print(json.load(open("dist/manifest.json"))["builds"][0]["ota"]["md5"])')"
          path="$(python3 -c 'import json;print(json.load(open("dist/manifest.json"))["builds"][0]["ota"]["path"])')"
          actual="$(md5sum "dist/${path}" | cut -d' ' -f1)"
          if [ "$declared" != "$actual" ]; then
            echo "::error::manifest md5 ${declared} does not match ${path} (${actual})"
            exit 1
          fi
          echo "manifest md5 matches ${path}: ${actual}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: firmware/esp32-panel/dist/
          retention-days: 30
          if-no-files-found: error
