name: Release

on:
  schedule:
    - cron: '0 2 * * 0'  # weekly, Sunday 02:00 UTC — the only scheduled release; never on push
  workflow_dispatch:  # manual release any time

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Cut the release
    runs-on: ubuntu-latest
    # Disable husky in CI so the semantic-release flow isn't intercepted by git hooks.
    env:
      HUSKY: 0
    outputs:
      # Empty when semantic-release decided there was nothing to release
      # — which is the normal outcome of a quiet week, not a failure.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: npm install

      # Record what the newest tag was BEFORE the release, so the step
      # after semantic-release can tell "a release was cut" from "there
      # was nothing to release". semantic-release's own exit status is 0
      # in both cases.
      - name: Tag before
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: semantic-release (release-only — does not touch CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Tag after
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          after="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          if [ "$after" = "${{ steps.before.outputs.tag }}" ] || [ "$after" = "none" ]; then
            echo "no new release this run"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "released $after"
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          fi

  # The panel firmware, attached to the release it belongs to.
  #
  # Why this job exists here rather than as a tag-triggered workflow:
  # semantic-release pushes its tag using GITHUB_TOKEN, and GitHub's own
  # documentation is explicit that "with the exception of
  # workflow_dispatch and repository_dispatch, other GITHUB_TOKEN-
  # triggered events do not create workflow runs at all". A
  # `on: push: tags:` trigger therefore never fires for a
  # semantic-release tag — it looks correct and silently does nothing.
  # Doing the work inside this run sidesteps the loop guard entirely.
  #
  # Until this landed, the firmware existed in exactly one place: the
  # published docs site, holding whichever build came off main last,
  # versioned by commit SHA. There was no copy of the firmware that
  # shipped with v1.0.0 or v1.1.0, and no way to go back to one — which
  # made "the running firmware survives a bad download" true only for
  # the download, not for a bad build.
  firmware:
    name: Build the panel firmware for the release
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/esphome-firmware.yml
    with:
      version: ${{ needs.release.outputs.tag }}

  attach:
    name: Attach firmware to the release
    needs: [release, firmware]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.firmware.outputs.artifact-name }}
          path: dist

      - name: Attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          # --clobber so a re-run of this job replaces the assets rather
          # than failing on "already exists", which would otherwise make
          # a retry impossible after a transient upload error.
          gh release upload "$TAG" \
            dist/cyd-scan-panel.factory.bin \
            dist/cyd-scan-panel.ota.bin \
            dist/manifest.json \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

      # The images are the other half of "what shipped with this tag".
      # ci.yml builds and pushes them, and its `on: push: tags:` trigger
      # cannot fire here for the reason documented above -- but
      # workflow_dispatch explicitly can, and is the documented
      # exception. Dispatching it at the tag ref is what gets a
      # ghcr.io/...:v1.2.3 to exist for a v1.2.3 release.
      - name: Publish images for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh workflow run ci.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY"
