# Lint, test and build for the three Go components.
#
# Until 2026-08-27 every job here was `echo "placeholder"`, so three Go
# modules and 26 test files were never built, linted or tested anywhere
# (issue #86). Every PR reported "Lint: pass / Test: pass / Build: pass"
# and none of those statements covered Go.
#
# The shell/YAML/Docker job calls `make` targets rather than repeating
# their commands, so what a contributor runs locally and what CI runs
# cannot drift apart there. The Go jobs deliberately do not: the matrix
# runs one module per leg so a failure names the module, and
# golangci-lint-action brings its own caching and annotations that
# shelling out to `make lint-go` would throw away. `make lint-go` and
# `make test-go` run the same commands over all three modules and stay
# the local entry point.

name: CI

on:
  push:
    branches: [main]
    # semantic-release creates the SemVer tag from release.yml, after
    # the push to main that produced the commit has already run. Without
    # this trigger a GitHub Release v1.2.3 would have no pullable
    # ghcr.io image tagged v1.2.3 -- the branch build published the
    # commit-describe version and nothing republished it under the tag.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The golangci-lint BINARY version -- unrelated to `version: "2"` in
  # .golangci.yml, which is that file's config-schema version.
  #
  # This one is coupled to the Go version and cannot lag behind it.
  # golangci-lint parses source with the go/types of the Go release it
  # was itself built with, so a binary built with an older Go does not
  # merely miss new checks -- it panics:
  #
  #   panic: file requires newer Go version go1.27
  #         (application built with go1.25)
  #
  # v2.13.0 is the release that added go1.27 support (golangci-lint
  # #6642). Whenever go.work moves to a new major Go release, this has
  # to move with it in the same commit.
  GOLANGCI_LINT_VERSION: v2.13.1

  # Pinned for the same reason. hadolint additionally carries its
  # published SHA-256 because it is fetched as a raw binary.
  YAMLLINT_VERSION: 1.37.1
  HADOLINT_VERSION: v2.14.0
  HADOLINT_SHA256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47

jobs:
  lint-go:
    name: Lint (Go)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [scan-bridge, sane-runtime, scan-processor]
    steps:
      - uses: actions/checkout@v7

      # go.work is the single source of truth for the Go version. It
      # and the three go.mod files now agree, but the workspace
      # directive is the one that binds: inside a workspace the higher
      # of the two wins, and setup-go pins GOTOOLCHAIN=local, so a
      # go.mod lagging behind go.work fails outright rather than
      # fetching a newer toolchain:
      #   go: ../../go.work requires go >= 1.27.0 (running go 1.25.0)
      # The project tracks the current stable Go release; see the note
      # on GOLANGCI_LINT_VERSION above, which has to move with it.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          # go.mod, not go.sum: sane-runtime and scan-processor have no
          # third-party dependencies and therefore no go.sum at all, and
          # setup-go aborts the leg with "Some specified paths were not
          # resolved" rather than skipping the cache. go.mod pins the
          # same versions for a cache key's purposes.
          cache-dependency-path: components/${{ matrix.module }}/go.mod

      # One module per matrix leg rather than one run over the
      # workspace: the three are independent modules with their own
      # go.mod, and a single `./...` from the root covers none of them.
      # A separate leg also names which module failed in the check list.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: components/${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml

  test-go:
    name: Test (Go)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [scan-bridge, sane-runtime, scan-processor]
    steps:
      - uses: actions/checkout@v7

      # go.work is the single source of truth for the Go version. It
      # and the three go.mod files now agree, but the workspace
      # directive is the one that binds: inside a workspace the higher
      # of the two wins, and setup-go pins GOTOOLCHAIN=local, so a
      # go.mod lagging behind go.work fails outright rather than
      # fetching a newer toolchain:
      #   go: ../../go.work requires go >= 1.27.0 (running go 1.25.0)
      # The project tracks the current stable Go release; see the note
      # on GOLANGCI_LINT_VERSION above, which has to move with it.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          # go.mod, not go.sum: sane-runtime and scan-processor have no
          # third-party dependencies and therefore no go.sum at all, and
          # setup-go aborts the leg with "Some specified paths were not
          # resolved" rather than skipping the cache. go.mod pins the
          # same versions for a cache key's purposes.
          cache-dependency-path: components/${{ matrix.module }}/go.mod

      # -race because these services are concurrent by construction: an
      # HTTP server, a job dispatcher and shared profile state. A data
      # race that only shows up under load on the Pi is exactly what
      # this is for.
      - name: go test -race
        working-directory: components/${{ matrix.module }}
        run: go test -race -count=1 ./...

      # Not part of `go test`: `go vet` is a separate contract, and
      # golangci-lint's govet runs with a narrower analyzer set.
      - name: go vet
        working-directory: components/${{ matrix.module }}
        run: go vet ./...

  lint-other:
    name: Lint (shell, YAML, Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Every tool is version-pinned, and the one fetched as a raw
      # binary is checksum-verified. An unpinned linter turns "CI went
      # red" into "upstream shipped an opinion overnight", and an
      # unverified binary from a release URL is a supply-chain hole in
      # a job that runs on every push.
      - name: Install linters
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          pipx install "yamllint==${YAMLLINT_VERSION}"
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint

      # Each target uses `git ls-files`, which skips the gitignored
      # ESPHome build tree under firmware/ -- several hundred vendored
      # upstream scripts we neither wrote nor lint.
      - run: make test-shell
      - run: make test-yaml
      - run: make test-docker

  build:
    name: Build images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # QEMU is what makes the linux/arm64 half of the bake possible on
      # an amd64 runner. The reference deployment is a Pi 5, so an image
      # that only builds for amd64 is an image that cannot be deployed.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Only on main. A pull request builds and throws the result away:
      # publishing an image from an unreviewed branch would put it in
      # the registry under a real version tag.
      - name: Log in to GHCR
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version stamp
        id: stamp
        run: |
          set -euo pipefail
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # -f docker-bake.hcl explicitly: with no -f, bake also reads
      # compose.yaml and merges its services in as targets, which
      # overrides VERSION from the environment and builds a different
      # set than intended.
      - name: Bake
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: default
          push: >-
            ${{ github.event_name == 'push' &&
                (github.ref == 'refs/heads/main' ||
                 startsWith(github.ref, 'refs/tags/v')) }}
        env:
          VERSION: ${{ steps.stamp.outputs.version }}
          COMMIT: ${{ steps.stamp.outputs.commit }}
          BUILD_DATE: ${{ steps.stamp.outputs.date }}
          # A bake `variable`, so it arrives through the environment --
          # not `--set *.args.`, which would make it a Dockerfile build
          # arg the images never read. `latest` moves only on a real
          # release tag, never on a main build. ADR 0011 keeps it out of
          # every compose file either way; this is for `docker pull`
          # convenience only.
          TAG_LATEST: ${{ startsWith(github.ref, 'refs/tags/v') }}
