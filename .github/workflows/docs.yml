# Documentation build and deploy for scan-bridge.strausmann.de.
#
# Zensical has no native multi-language support yet, so the site is two
# separate builds stitched into one artifact. BUILD ORDER MATTERS: the
# English build writes to site/ and clears it first, which would delete
# site/de/. English must run before German, never the other way round.
# Tracked in issue #13; upstream in zensical/backlog#2 and #1.
#
# The site makes no third-party requests at runtime. Mermaid and ESP Web
# Tools are vendored (both would otherwise be fetched from unpkg.com /
# the npm CDN) and Google Fonts is off via `font = false`. All of that
# is asserted below, because a silent regression here is exactly the
# kind that nobody notices.
#
# The firmware job (calls esphome-firmware.yml) runs on every trigger of
# this workflow, not just when firmware/ changed: a Pages deployment
# replaces the whole published site tree each time, so site/firmware/
# would otherwise go missing from a deploy triggered by a docs-only
# change. This is deliberately not incremental — see the PR that
# introduced it for the CI-cost tradeoff that was accepted here.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'firmware/esp32-panel/**'
      - 'zensical.toml'
      - 'zensical.de.toml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - '.github/workflows/esphome-firmware.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'firmware/esp32-panel/**'
      - 'zensical.toml'
      - 'zensical.de.toml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      - '.github/workflows/esphome-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_DOMAIN: scan-bridge.strausmann.de

jobs:
  firmware:
    name: Firmware
    uses: ./.github/workflows/esphome-firmware.yml

  build:
    name: Build site
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install Zensical
        run: pip install -r requirements-docs.txt

      - name: Vendor Mermaid
        run: ./.github/scripts/vendor-mermaid.sh

      - name: Vendor ESP Web Tools
        run: ./.github/scripts/vendor-esp-web-tools.sh

      - name: Vendor Improv Wi-Fi BLE SDK
        run: ./.github/scripts/vendor-improv-wifi.sh

      - name: Vendor Scalar
        run: ./.github/scripts/vendor-scalar.sh

      - name: Copy OpenAPI spec into the docs site
        run: |
          mkdir -p docs/en/api-reference
          cp components/scan-bridge/api/openapi.yaml docs/en/api-reference/openapi.yaml

      - name: Build English site
        run: zensical build -f zensical.toml --strict

      - name: Build German site
        run: zensical build -f zensical.de.toml --strict

      - name: Assert both languages are present
        run: |
          if [ ! -f site/index.html ]; then
            echo "::error::site/index.html missing"
            exit 1
          fi
          if [ ! -f site/de/index.html ]; then
            echo "::error::site/de/index.html missing - build order wrong?"
            exit 1
          fi

      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.firmware.outputs.artifact-name }}
          path: site/firmware

      - name: Assert no third-party assets are referenced
        run: python3 .github/scripts/check_no_external_assets.py site

      - name: Assert internal working documents were not published
        run: |
          for d in research superpowers decisions learnings; do
            if [ -e "site/$d" ]; then
              echo "::error::site/$d published - keep it out of docs_dir"
              exit 1
            fi
          done

      - name: Write CNAME
        run: echo "$SITE_DOMAIN" > site/CNAME

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --accept 200,206,429 'site/**/*.html'
          fail: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
