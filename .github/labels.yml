# Label taxonomy as code (codifies the existing type:* / scope:* labels + adds status/priority).
# Synced with delete-other-labels: false, so existing labels not listed here are left untouched.

# --- type ---
- name: "type:feature"
  color: "0e8a16"
  description: "New capability"
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type:chore"
  color: "fef2c0"
  description: "Tooling / maintenance"
- name: "type:hardware"
  color: "fad8c7"
  description: "Scanner / hardware specific"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation / ADRs"
- name: "type:refactor"
  color: "5319e7"
  description: "Code change without behaviour change"
- name: "type:security"
  color: "b60205"
  description: "Security-relevant"

# --- scope (component subsystems; mirror .github/SCOPES.md) ---
- name: "scope:scan-bridge"
  color: "c2e0c6"
  description: "Go daemon"
- name: "scope:sane-runtime"
  color: "c2e0c6"
  description: "SANE/scanbd/USB container"
- name: "scope:scan-processor"
  color: "c2e0c6"
  description: "PDF / Paperless ingestion"
- name: "scope:api"
  color: "c2e0c6"
  description: "HTTP API"
- name: "scope:profiles"
  color: "c2e0c6"
  description: "Scan profiles"
- name: "scope:deploy"
  color: "c2e0c6"
  description: "compose / Tilt / udev / NFS"
- name: "scope:ci"
  color: "c2e0c6"
  description: "CI / release tooling"
- name: "scope:docs"
  color: "c2e0c6"
  description: "Documentation"

# --- status ---
- name: "status:triage"
  color: "ededed"
  description: "Needs triage"
- name: "status:in-progress"
  color: "fbca04"
  description: "Being worked on"
- name: "status:blocked"
  color: "d93f0b"
  description: "Blocked by something else"
- name: "status:needs-info"
  color: "d4c5f9"
  description: "Waiting for more information"

# --- priority ---
- name: "priority:critical"
  color: "b60205"
  description: "Critical"
- name: "priority:high"
  color: "d93f0b"
  description: "High"
- name: "priority:medium"
  color: "fbca04"
  description: "Medium"
- name: "priority:low"
  color: "0e8a16"
  description: "Low"

# --- meta ---
- name: "breaking-change"
  color: "b60205"
  description: "Backwards-incompatible change"
- name: "release-note"
  color: "c5def5"
  description: "Call out in release notes"
