# Dependabot configuration.
#
# Renovate is the project's primary update bot for container image
# tags (per AGENTS.md). Dependabot covers the ecosystems Renovate
# does not — Go modules, GitHub Actions, and Dockerfile base images
# inside the three custom container components.
#
# Per-component gomod and docker entries are added by each component's
# own Phase 1 session, once that component ships a go.mod and a
# Dockerfile. Listing them here before the manifests exist makes
# Dependabot emit a "manifest file not found" error on every run, so
# we keep the file lean until the targets are real.
#
# `labels:` entries are intentionally omitted: Dependabot validates
# every label exists in the repo on every run and emits "could not be
# found" errors otherwise. The project label taxonomy (type:*, scope:*,
# needs-triage) needs to be created in the repo settings first; the
# label refs can then be re-added in a follow-up PR. The Conventional-
# Commits-shaped commit-message prefix already gives PR triage what it
# needs in the meantime.

version: 2
updates:
  # GitHub Actions used in CI / docs workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope

  # Go modules for the scan-bridge component (added now that
  # components/scan-bridge/go.mod has landed).
  - package-ecosystem: gomod
    directory: /components/scan-bridge
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(scan-bridge)"
      include: scope

  # Dockerfile base images for scan-bridge (added now that
  # components/scan-bridge/Dockerfile has landed).
  - package-ecosystem: docker
    directory: /components/scan-bridge
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(scan-bridge)"
      include: scope
