# Dependabot configuration.
#
# Renovate is the project's primary update bot for container image
# tags (per AGENTS.md). Dependabot covers the ecosystems Renovate
# does not — Go modules, GitHub Actions, and Dockerfile base images
# inside the three custom container components.
#
# All three components now ship a go.mod and a Dockerfile, so all three
# have gomod and docker entries below. Until 2026-08-27 only
# scan-bridge did, which meant sane-runtime and scan-processor received
# no dependency or base-image updates at all -- the entries were meant
# to be added by each component's own session and were forgotten when
# those components landed.
#
# The project tracks the current stable Go release. Dependabot's gomod
# updater proposes the `go` directive as it moves, and the docker
# updater proposes the `golang:` base image; both have to be accepted
# together with GOLANGCI_LINT_VERSION in ci.yml, which is coupled to
# the Go version (see the note there).
#
# `labels:` entries are still omitted, but the original reason no
# longer applies: the type:*, scope:* and needs-triage taxonomy exists
# in the repo now. Re-adding the label refs is a small follow-up change
# and deliberately kept out of unrelated PRs. The Conventional-Commits-
# shaped commit-message prefix gives PR triage what it needs meanwhile.

version: 2
updates:
  # GitHub Actions used in CI / docs workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope

  # Go modules for the scan-bridge component (added now that
  # components/scan-bridge/go.mod has landed).
  - package-ecosystem: gomod
    directory: /components/scan-bridge
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(scan-bridge)"
      include: scope

  # Documentation toolchain (requirements-docs.txt). Zensical is pinned
  # exactly because it is still alpha; every bump PR from this entry is
  # the scheduled checkpoint for the i18n and blog workarounds tracked
  # in issue #13.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docs"
      include: scope

  # Dockerfile base images for scan-bridge (added now that
  # components/scan-bridge/Dockerfile has landed).
  - package-ecosystem: docker
    directory: /components/scan-bridge
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(scan-bridge)"
      include: scope

  # Go modules for sane-runtime.
  - package-ecosystem: gomod
    directory: /components/sane-runtime
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(sane-runtime)"
      include: scope

  # Dockerfile base images for sane-runtime.
  - package-ecosystem: docker
    directory: /components/sane-runtime
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(sane-runtime)"
      include: scope

  # Go modules for scan-processor.
  - package-ecosystem: gomod
    directory: /components/scan-processor
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(scan-processor)"
      include: scope

  # Dockerfile base images for scan-processor.
  - package-ecosystem: docker
    directory: /components/scan-processor
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(scan-processor)"
      include: scope
