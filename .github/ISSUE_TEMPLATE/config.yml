blank_issues_enabled: false
contact_links:
  - name: Questions and discussion
    url: https://github.com/strausmann/paperless-scan-bridge/discussions
    about: |
      Use GitHub Discussions for usage questions, "is this possible?",
      and design conversations. Reserve issues for confirmed bugs,
      feature requests, and hardware reports.
  - name: Security disclosure
    url: https://github.com/strausmann/paperless-scan-bridge/blob/main/SECURITY.md
    about: |
      Do not file public issues for security vulnerabilities. Follow
      the responsible disclosure procedure documented in SECURITY.md.
  - name: Documentation site
    url: https://strausmann.github.io/paperless-scan-bridge/
    about: |
      Quickstart, troubleshooting, hardware guides, architecture
      deep-dives. If your question is answered here, please link the
      page in any follow-up issue you open.
