global {
    debug = true
    debug-level = 7
    user = root
    group = root
    saned = "/usr/sbin/saned"
    saned_opt = {}
    saned_env = {}
    scriptdir = "/tmp"
    timeout = 250
    pidfile = "/tmp/scanbd.pid"
    environment {
        device = "SCANBD_DEVICE"
        action = "SCANBD_ACTION"
    }
    function function_knob {
        filter = "^message.*"
        desc = "Function knob"
        env = "SCANBD_FUNCTION"
    }
    multiple_actions = true
}
device avision {
    filter = "^avision.*"
    desc = "Avision/Kodak Scanner"
    action catch_all {
        filter = "^message.*"
        desc = "ANY message change"
        script = "echo.script"
        string-trigger {
            from-value = ""
            to-value = "^.+"
        }
    }
}
