# Zensical configuration — English site, served at the domain root.
#
# The German site is a second, separate build; see zensical.de.toml.
# Zensical has no native multi-language support yet (the `alternate`
# setting below only renders the header language switcher), so each
# language gets its own docs_dir and site_dir and CI stitches the two
# outputs together.
#
# Upstream: https://github.com/zensical/backlog/issues/2 (native i18n)
# and https://github.com/zensical/backlog/issues/1 (mkdocs-static-i18n
# compatibility). Both open, no milestone. Our side: issue #13.
#
# Note which directories are deliberately NOT part of docs_dir:
# docs/research/, docs/superpowers/, docs/decisions/ and
# docs/learnings/ are internal working documents and must not be
# published. Keeping docs_dir at docs/en excludes them by construction.

[project]
site_name = "paperless-scan-bridge"
site_url = "https://scan-bridge.strausmann.de/en/"
site_description = "Turn a SANE-compatible USB scanner into a hands-free ingestion pipeline for Paperless-ngx."
site_author = "Björn Strausmann"
copyright = "Copyright &copy; 2026 Björn Strausmann"
repo_url = "https://github.com/strausmann/paperless-scan-bridge"
repo_name = "strausmann/paperless-scan-bridge"
edit_uri = "edit/main/docs/en/"

docs_dir = "docs/en"
site_dir = "site/en"

nav = [
  { "Home" = "index.md" },
  { "Install panel" = "install/index.md" },
  { "Manage panel" = "manage/index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    "getting-started/quickstart.md",
    "getting-started/scan-profiles.md",
    "getting-started/profile-schema.md",
  ] },
  { "Architecture" = [
    "architecture/index.md",
    "architecture/storage-topologies.md",
    "architecture/no-third-party-requests.md",
  ] },
  { "Hardware" = [
    "hardware/index.md",
    "hardware/kodak-scanmate-i1120.md",
    "hardware/cyd-scan-panel.md",
  ] },
  { "Operations" = [
    "operations/index.md",
    "operations/troubleshooting.md",
  ] },
  { "API reference" = ["api-reference/index.md"] },
  { "Blog" = "blog/index.md" },
]

# Mermaid is loaded from our own domain, not from unpkg.com. Zensical
# lazy-loads it from the CDN only when the global `mermaid` is still
# undefined; the upstream bundle assigns `globalThis["mermaid"]` itself,
# so listing it here satisfies that guard and no third-party request is
# ever made. Fetched at build time by .github/scripts/vendor-mermaid.sh
# (pinned version + sha384), gitignored, see issue #13.
# panel-tools.js loads the ESP Web Tools / Improv bundles for the
# /install/ and /manage/ pages. It must live here rather than as an
# inline <script> in those pages: navigation.instant injects pages via
# XHR without re-parsing the document, so an inline script never runs
# when a visitor clicks through instead of loading the URL directly.
# See the file header for the whole story.
extra_javascript = ["javascripts/mermaid.min.js", "javascripts/panel-tools.js"]

[project.theme]
language = "en"

# No Google Fonts. The default theme pulls Inter and JetBrains Mono
# from fonts.googleapis.com, which sends every visitor's IP to a
# third party — the same objection as the unpkg Mermaid load, and a
# well-litigated one in Germany. System fonts instead.
font = false

# Template overrides. Only "home.html" exists here (assigned via
# `template: home.html` in docs/en/index.md front matter) — it makes
# the homepage a custom landing page while every other page keeps the
# default docs template untouched. See docs/en/index.md and
# overrides/home.html for the mechanism; both were verified against
# Zensical's own customization docs before use, not guessed.
custom_dir = "overrides"

features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
alternate = [
  { name = "English", link = "/", lang = "en" },
  { name = "Deutsch", link = "/de/", lang = "de" },
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/strausmann/paperless-scan-bridge"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true }

pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}

pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}

pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}

pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}

# Mermaid diagrams. The renderer is self-hosted — see extra_javascript
# above. https://github.com/zensical/backlog/issues/155 would render
# diagrams at build time and remove the 3.5 MB client-side bundle
# entirely; until then, self-hosting is what keeps visitors off unpkg.
pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}

pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}
