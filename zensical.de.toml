# Zensical configuration — German site, served under /de/.
#
# Second build of the same project; see zensical.toml for the English
# site and for why two configs exist instead of one i18n-aware one.
# Upstream: https://github.com/zensical/backlog/issues/2 (native i18n),
# https://github.com/zensical/backlog/issues/1 (mkdocs-static-i18n
# compatibility). Our side: issue #13.
# Keep the two files in sync: theme features, palette, markdown
# extensions and social links must not drift apart, or the two halves
# of the site start looking like different projects.

[project]
site_name = "paperless-scan-bridge"
site_url = "https://scan-bridge.strausmann.de/de/"
site_description = "Ein SANE-kompatibler USB-Scanner wird zur freihändigen Ingestion-Pipeline für Paperless-ngx."
site_author = "Björn Strausmann"
copyright = "Copyright &copy; 2026 Björn Strausmann"
repo_url = "https://github.com/strausmann/paperless-scan-bridge"
repo_name = "strausmann/paperless-scan-bridge"
edit_uri = "edit/main/docs/de/"

docs_dir = "docs/de"
site_dir = "site/de"

# URL PARITY: the directory names under docs/de/ deliberately match
# docs/en/ exactly (install/, manage/, getting-started/, hardware/), even
# though the nav labels are German. A reader must be able to switch
# language by editing nothing but the /de/ prefix — translating the slugs
# too would break that, and break every cross-language link.
nav = [
  { "Start" = "index.md" },
  { "Panel installieren" = "install/index.md" },
  { "Panel verwalten" = "manage/index.md" },
  { "Erste Schritte" = [
    "getting-started/index.md",
    "getting-started/quickstart.md",
  ] },
  { "Hardware" = ["hardware/index.md"] },
]

# Same self-hosted Mermaid setup as the English site; see zensical.toml
# for why this replaces the unpkg.com load.
#
# NOTE: install/ and manage/ load the ESP Web Tools and Improv
# Wi-Fi bundles with ABSOLUTE paths (/javascripts/...), which resolve to
# the English site's vendored copies at the domain root — the German
# site is served under /de/ on the same origin, so there is no second
# copy to vendor and no third-party request. The dependency is real
# though: moving or renaming those paths in zensical.toml silently
# breaks the two German pages, and only a browser click would notice.
# panel-tools.js is referenced with an ABSOLUTE /en/ path here, unlike
# every other asset in this file: the German site has no vendored copy of
# its own, and /en/javascripts/ resolves to the English site's file on the
# same origin. That avoids a second, drifting copy of the same source file
# under docs/de/ — at the cost of a hard dependency on the English site's
# layout, which is why both prefixes are spelled out rather than guessed.
#
# panel-tools.js loads the ESP Web Tools / Improv bundles for the
# /install/ and /manage/ pages. It must live here rather than as an
# inline <script> in those pages: navigation.instant injects pages via
# XHR without re-parsing the document, so an inline script never runs
# when a visitor clicks through instead of loading the URL directly.
# See the file header for the whole story.
extra_javascript = ["javascripts/mermaid.min.js", "/en/javascripts/panel-tools.js"]

[project.theme]
language = "de"

# No Google Fonts. The default theme pulls Inter and JetBrains Mono
# from fonts.googleapis.com, which sends every visitor's IP to a
# third party — the same objection as the unpkg Mermaid load, and a
# well-litigated one in Germany. System fonts instead.
font = false

features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Zu hellem Design wechseln"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Zu dunklem Design wechseln"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Systemeinstellung übernehmen"

[project.extra]
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "Deutsch", link = "/de/", lang = "de" },
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/strausmann/paperless-scan-bridge"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true }

pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}

pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}

pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}

pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}

pymdownx.superfences = {
  custom_fences = [
    {
      name = "mermaid",
      class = "mermaid",
      format = "pymdownx.superfences.fence_code_format",
    },
  ],
}

pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}
