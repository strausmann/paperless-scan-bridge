# Phase 1.2 (Task 15) hardware smoke-test configuration for scan-bridge.
# Mounted read-only at /etc/scan-bridge/config.toml
# (components/scan-bridge/Dockerfile CMD default).
#
# Schema/precedence: components/scan-bridge/internal/config/config.go.
#
# auth.token_hash is the SHA-256 hex digest of a throwaway test bearer
# token generated for this deploy (openssl rand -hex 32). Per ADR 0006
# only the hash is ever stored/committed — the plaintext token lives
# only with the operator running the morning test, never in this repo.
# tokenMatches() (components/scan-bridge/internal/api/auth.go) rejects
# every request whenever token_hash is empty, so an unset value here
# would mean nobody could ever authenticate, not "auth disabled".

[server]
listen = ":8080"
metrics_listen = ":9090"

[auth]
mode = "token"
token_hash = "8a6d19146ff50a7a12c0fcbd7444a5e041a7900a7c4e186d11af304f2894e30a"

[paths]
profiles = "/etc/scan-bridge/profiles.yaml"
state_dir = "/var/lib/scan-bridge"
sane_socket = "/run/sane-runtime/sane.sock"
output_dir = "/var/lib/scan-bridge/scans"

[logging]
level = "info"
format = "json"

[shutdown]
sigterm_timeout_seconds = 30
sigint_timeout_seconds = 5
hard_timeout_seconds = 60

# The panel-firmware mirror (ADR 0024, issue #111). The bridge fetches
# the CYD panel's firmware from GitHub Releases, verifies it against the
# release's own SHA256SUMS, and serves it over plain HTTP on the LAN at
# /firmware/manifest.json -- because the panel's ESP32 has no heap left
# for a TLS session and cannot reach GitHub itself.
#
# cache_dir sits under state_dir on purpose: unlike scan output (tmpfs,
# see deploy/compose/scan-bridge.yml) this has to survive a restart, or
# every reboot re-downloads ~1.7 MB and answers 503 until it finishes.
#
# Set enabled = false if you run no panel. It costs one unauthenticated
# GitHub API call every five hours otherwise -- well inside the
# 60-per-hour limit, which is why the mirror carries no token.
[firmware]
enabled = true
cache_dir = "/var/lib/scan-bridge/firmware"
repo = "strausmann/paperless-scan-bridge"
api_base = "https://api.github.com"
refresh_interval_seconds = 18000
